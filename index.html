    <script>
/* Format kode TP: TP. <Kelas><Semester><No. TP>  contoh: TP. 411 = Kelas 4, Semester 1, TP ke-1 */
(function(){
  function sem(x){return x==='genap'||x===2||x==='2'?2:1}
  /* Kode TP (ATP): TP. <Kelas><Semester><No. CP><No. Urut TP>  contoh: TP. 4121 = Kelas 4, Semester 1, CP ke-2, TP urutan ke-1.
     Tanpa cpNo (Prota/Prosem): TP. <Kelas><Semester><No. TP> seperti sebelumnya. */
  window.__tpCode=function(grade,semester,no,cpNo){return 'TP. '+grade+sem(semester)+(cpNo==null?'':cpNo)+no};
  window.__sipCpEls=window.__sipCpEls||{};
  window.__sipRegCps=function(list){try{(list||[]).forEach(function(c){if(c&&c.id&&Array.isArray(c.elements))window.__sipCpEls[c.id]=c.elements})}catch(e){}};
  function nk(x){return String(x==null?'':x).toLowerCase().replace(/[^a-z0-9]+/g,'')}
  /* nomor CP (1-based) dari sebuah TP = urutan elemen CP pada daftar elemen; 0 bila tidak ditemukan */
  window.__tpCpIndex=function(els,o){
    if(!els||!els.length||!o)return 0;
    var n=nk(o.cpElementName),i,e;
    if(n){for(i=0;i<els.length;i++){if(nk(els[i].name)===n)return i+1}}
    if(o.cpElementRefId){for(i=0;i<els.length;i++){if(els[i].id===o.cpElementRefId)return i+1}}
    if(n&&n.length>3){for(i=0;i<els.length;i++){e=nk(els[i].name);if(e.length>3&&(e.indexOf(n)>-1||n.indexOf(e)>-1))return i+1}}
    return 0};
  /* ATP: beri nomor ulang per semester menurut urutan objectives */
  window.__tpNormAtp=function(a){
    if(!a||!Array.isArray(a.objectives))return a;
    var els=(window.__sipCpEls||{})[a.cpId]||[],cnt={};
    var objs=a.objectives.map(function(o,i){
      var sm=sem(o.semesterTarget),cp=window.__tpCpIndex(els,o),k=sm+'|'+cp;cnt[k]=(cnt[k]||0)+1;
      var jp=Number(o.jpAllocation)||0,as=(Number(o.assessmentJp)||0)>0?1:0;
      return Object.assign({},o,{order:i+1,code:window.__tpCode(a.grade,sm,cnt[k],cp),assessmentJp:as});
    });
    return Object.assign({},a,{objectives:objs});
  };
  /* pratinjau kode untuk formulir TP (tambah/ubah) */
  window.__tpPreviewCode=function(a,semTarget,elName,editing){
    var objs=(a.objectives||[]).map(function(o){return editing&&o.id===editing.id?Object.assign({},o,{semesterTarget:semTarget,cpElementName:elName}):o});
    if(!editing)objs=objs.concat([{id:'__new__',semesterTarget:semTarget,cpElementName:elName,jpAllocation:0}]);
    var n=window.__tpNormAtp(Object.assign({},a,{objectives:objs})),id=editing?editing.id:'__new__',r=n.objectives.filter(function(o){return o.id===id})[0];
    return r?r.code:'';
  };
  /* Prota: nomor ulang per semester menurut urutan item */
  window.__tpNormProta=function(p){
    if(!p||!Array.isArray(p.items))return p;
    var cnt={1:0,2:0};
    return Object.assign({},p,{items:p.items.map(function(it){
      var sm=sem(it.semester);cnt[sm]++;
      var jp=Number(it.jp)||0,as=(Number(it.assessmentJp)||0)>0?1:0;
      return Object.assign({},it,{tpCode:window.__tpCode(p.grade,sm,cnt[sm]),assessmentJp:as});
    })});
  };
  /* Prosem: nomor ulang menurut urutan baris pada semester tsb */
  window.__tpNormProsem=function(p){
    if(!p||!Array.isArray(p.rows))return p;
    var sm=sem(p.semester),n=0;
    return Object.assign({},p,{rows:p.rows.map(function(r){
      n++;var tj=Number(r.totalJp)||0,as=Math.min(Math.max(0,Number(r.assessmentJp)||0),tj);return Object.assign({},r,{tpCode:window.__tpCode(p.grade,sm,n),assessmentJp:as});
    })});
  };
})();

      a.forEach(function (r) {

        var d = docId(k, r.id);
        if (!recs[d] && !tombs[d]) recs[d] = { value: JSON.stringify(r), at: 0, legacy: true };
      });
    });
    ARRAY_KEYS.forEach(function (k) {
      var arr = readArr(k), changed = false, add = [], idx = {}, pre = k + "~";
      arr.forEach(function (r, i) { if (r && r.id != null) idx[docId(k, r.id)] = i; });
      Object.keys(recs).forEach(function (d) {
        if (d.indexOf(pre) !== 0) return;
        var remote; try { remote = JSON.parse(recs[d].value); } catch (e) { return; }
        var rj = JSON.stringify(remote);
        if (k === "rc_audit_logs") st.auditTs[d] = tsOf(remote);
        if (d in idx) {
          var lj = JSON.stringify(arr[idx[d]]);
          if (lj === rj) { if (!recs[d].legacy) st.known[d] = rj; }   // dari dokumen lama: belum ada di cloud per-record, harus diunggah
          else if (tsOf(arr[idx[d]]) > tsOf(remote)) { /* lokal lebih baru: dibiarkan, akan diunggah */ }
          else { arr[idx[d]] = remote; if (!recs[d].legacy) st.known[d] = rj; changed = true; }
        } else { add.push(remote); if (!recs[d].legacy) st.known[d] = rj; changed = true; }
      });
      Object.keys(tombs).forEach(function (d) {
        if (d.indexOf(pre) !== 0) return;
        if (d in idx) {
          var lt = Date.parse(tsOf(arr[idx[d]])) || 0;
          if (lt > (tombs[d].at || 0)) return;   // dibuat/diubah lokal setelah dihapus: pertahankan
          arr[idx[d]] = null; changed = true;
        }
        st.known[d] = null;
      });
      if (!changed) return;
      arr = arr.filter(Boolean);
      add.sort(function (x, y) { return tsOf(y) < tsOf(x) ? -1 : tsOf(y) > tsOf(x) ? 1 : 0; });
      arr = add.concat(arr);
      if (k === "rc_audit_logs") arr = trimAuditArr(arr);
      writeArr(k, arr);
      if (k === "rc_users") usersChanged = true;
    });
    return { legacy: Object.keys(legacy), usersChanged: usersChanged };
  }

  function listen() {
    return new Promise(function (resolve, reject) {
      var first = true;
      st.fs.onSnapshot(st.fs.collection(st.db, "schools", SCHOOL_ID, "data"), function (snap) {
        var changed = false, usersChanged = false, info = null;
        st.applying = true;
        try {
          if (first) {
            info = reconcileFirst(snap);
            usersChanged = info.usersChanged;
          }
          snap.docChanges().forEach(function (ch) {
            if (ch.type === "removed" || ch.doc.metadata.hasPendingWrites) return;
            var k = ch.doc.id, d = ch.doc.data(), p = k.indexOf("~");
            if (p > 0) {                                  // record per-dokumen
              if (first) return;                          // sudah ditangani reconcileFirst
              var key = k.slice(0, p);
              if (!isArr(key) || st.busy[k] > 0) return;
              if (applyRec(key, k, d)) { changed = true; if (key === "rc_users") usersChanged = true; }
              return;
            }
            if (isArr(k)) return;                         // dokumen lama: hanya dibaca saat startup
            if (!isSync(k) || typeof d.value !== "string") return;
            if (st.pending[k] || st.busy[k] > 0) return;  // jangan timpa tulisan lokal yang sedang berjalan
            if (ls.getItem(k) !== d.value) { oSet.call(ls, k, d.value); changed = true; }
          });
        } finally { st.applying = false; }
        if (usersChanged && window.__rcEnsureSelf) window.__rcEnsureSelf();
        if (first) {
          first = false;
          st.ready = true;
          var existing = {};
          snap.forEach(function (d) { existing[d.id] = 1; });
          // Unggah yang belum ada di cloud: kunci dokumen tunggal + semua record lokal yang belum dikenal cloud.
          KEYS.forEach(function (k) {
            if (isArr(k)) { if (ls.getItem(k) !== null) queue(k); }
            else if (!existing[k] && ls.getItem(k) !== null) queue(k);
          });
          // Setelah record hasil migrasi terunggah, tandai dokumen lama agar tidak dibaca lagi (mencegah data terhapus "hidup" kembali).
          var legacyKeys = info ? info.legacy : [];
          if (legacyKeys.length) {
            setTimeout(function () {
              flush().then(function () {
                legacyKeys.forEach(function (k) {
                  st.fs.setDoc(docRef(k), { migrated: true }, { merge: true }).catch(function (e) { console.warn("[Firestore] tandai migrasi gagal " + k, e); });
                });
              });
            }, 900);
          }
          trimAuditCloud();
          resolve();
        } else if (changed) {
          showBanner();
        }
      }, function (err) {
        if (first) { first = false; reject(err); } else { console.warn("[Firestore] listener", err); setBadge("err", err && err.code); }
      });
    });
  }

  /* ---------- UI kecil: login, lencana status, banner ---------- */
  function whenBody(f) { if (document.body) f(); else document.addEventListener("DOMContentLoaded", f); }
  function el(tag, css, html) { var e = document.createElement(tag); e.style.cssText = css || ""; if (html) e.innerHTML = html; return e; }

  var badge;
  function setBadge(state, detail) {
    whenBody(function () {
      if (!badge) {
        badge = el("div", "position:fixed;left:12px;bottom:12px;z-index:99998;font:600 11px/1 'Plus Jakarta Sans',sans-serif;padding:7px 10px;border-radius:999px;background:#fff;border:1px solid #cbd5e1;color:#334155;box-shadow:0 1px 4px rgba(0,0,0,.12);cursor:pointer");
        badge.title = "Klik untuk keluar akun";
        badge.onclick = function () {
          if (st.user && confirm("Keluar dari akun " + st.user.email + "?")) st.authM.signOut(st.auth).then(function () { location.reload(); });
        };
        document.body.appendChild(badge);
      }
      var who = st.user ? " · " + st.user.email : "";
      if (state === "ok") { badge.textContent = "☁ Tersinkron" + who; badge.style.color = "#0f766e"; }
      else if (state === "sync") { badge.textContent = "☁ Menyimpan…"; badge.style.color = "#b45309"; }
      else if (state === "local") { badge.textContent = "Mode lokal (belum tersinkron)"; badge.style.color = "#b45309"; }
      else { badge.textContent = "⚠ Sinkron gagal" + (detail ? " (" + detail + ")" : ""); badge.style.color = "#be123c"; }
    });
  }

  function showBanner() {
    whenBody(function () {
      if (document.getElementById("rc-remote-banner")) return;
      var b = el("div", "position:fixed;top:0;left:0;right:0;z-index:99999;background:#0f766e;color:#fff;padding:10px 16px;font:600 13px 'Plus Jakarta Sans',sans-serif;text-align:center");
      b.id = "rc-remote-banner";
      b.innerHTML = "Data diperbarui dari perangkat lain. <button style='margin-left:8px;background:#fff;color:#0f766e;border:0;border-radius:6px;padding:4px 10px;font-weight:700;cursor:pointer'>Muat ulang</button>";

      document.body.appendChild(b);
    });
  }

  var loginBox;
  function showLoading(text) {
    if (window.__sipenaAuthUI && window.__sipenaAuthUI.loading) window.__sipenaAuthUI.loading(text); else hideLogin();
  }
  function showLogin(doLogin, message) {
    if (window.__sipenaAuthUI) { window.__sipenaAuthUI.show(doLogin, message); return; }
    whenBody(function () {
      if (!loginBox) {
        loginBox = el("div", "position:fixed;inset:0;z-index:100000;background:#F8FAFC;display:flex;align-items:center;justify-content:center;font-family:'Plus Jakarta Sans',sans-serif");
        loginBox.innerHTML =
          "<div style='background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:32px;max-width:360px;width:90%;text-align:center;box-shadow:0 4px 24px rgba(15,23,42,.08)'>" +
          "<div class='sipena-logo sipena-logo--lg' style='margin:0 auto 16px'>" + window.__SIPENA_LOGO + "</div>" +
          "<div class='sipena-3d sipena-3d--sm' data-text='SIPENA' style='font-size:32px'>SIPENA</div>" +
          "<div style='font-size:13px;color:#64748b;margin:10px 0 20px'><b style='color:#0f766e'>Sistem Perencanaan Pembelajaran</b><br>UPTD SPF SD Negeri Lanas 1<br>Masuk dengan akun Google yang terdaftar</div>" +
          "<button id='rc-login-btn' style='width:100%;padding:11px;border-radius:10px;border:0;background:#0f766e;color:#fff;font-weight:700;font-size:14px;cursor:pointer'>Masuk dengan Google</button>" +
          "<div id='rc-login-msg' style='font-size:12px;color:#be123c;margin-top:12px;min-height:16px'></div></div>";
        document.body.appendChild(loginBox);
      }
      loginBox.style.display = "flex";
      loginBox.querySelector("#rc-login-msg").textContent = message || "";
      loginBox.querySelector("#rc-login-btn").onclick = function () {
        doLogin().catch(function (e) { loginBox.querySelector("#rc-login-msg").textContent = "Gagal masuk: " + ((e && e.code) || e); });
      };
    });
  }
  function hideLogin() { if (loginBox) loginBox.style.display = "none"; }

  function emailAllowed(email) {
    var e = String(email || "").toLowerCase(), at = e.lastIndexOf("@");
    if (at < 1) return false;
    var d = e.slice(at + 1);
    return ALLOWED_DOMAINS.some(function (a) { return d === a || d.slice(-(a.length + 1)) === "." + a; });
  }

  function requireLogin() {
    return new Promise(function (resolve) {
      var done = false, notice = "";
      st.authM.onAuthStateChanged(st.auth, function (u) {
        if (u && !emailAllowed(u.email)) {
          notice = "Akun " + u.email + " tidak diizinkan. Gunakan akun belajar.id.";
          st.authM.signOut(st.auth);
          return;
        }
        if (u) { showLoading("Memuat data sekolah\u2026"); if (!done) { done = true; resolve(u); } }
        else {
          showLogin(function () {
            var p = new st.authM.GoogleAuthProvider();
            p.setCustomParameters({ prompt: "select_account" }); // tanpa "hd" agar akun bersubdomain (guru.sd.belajar.id) tetap muncul
            return st.authM.signInWithPopup(st.auth, p);
          }, notice);
          notice = "";
        }
      });
    });
  }

  /* ---------- Bootstrap: aplikasi baru dirender setelah promise ini selesai ---------- */
  window.__rcReady = (async function () {
    if (/ISI_/.test(JSON.stringify(FIREBASE_CONFIG))) {
      console.warn("[Firestore] FIREBASE_CONFIG belum diisi — aplikasi berjalan dalam mode lokal.");
      setBadge("local");
      return;
    }
    window.__rcCloud = true;
    try {
      var mods = await Promise.all([import(SDK + "firebase-app.js"), import(SDK + "firebase-auth.js"), import(SDK + "firebase-firestore.js")]);
      var app = mods[0].initializeApp(FIREBASE_CONFIG);
      st.authM = mods[1]; st.fs = mods[2];
      st.auth = st.authM.getAuth(app);
      try { // cache offline (IndexedDB) agar tetap bisa dipakai saat sinyal buruk
        st.db = st.fs.initializeFirestore(app, { localCache: st.fs.persistentLocalCache({ tabManager: st.fs.persistentMultipleTabManager() }) });
      } catch (e) { st.db = st.fs.getFirestore(app); }
      st.user = await requireLogin();
      window.__rcUser = { email: st.user.email, name: st.user.displayName || "" };
      await listen();
      setBadge("ok");
      window.addEventListener("pagehide", flush);
      document.addEventListener("visibilitychange", function () { if (document.visibilityState === "hidden") flush(); });
    } catch (e) {
      console.error("[Firestore] inisialisasi gagal", e);

      setBadge("err", denied ? "akun belum terdaftar" : (e && e.code));
    }
  })();
})();

ectiveDay:!0},{id:`cal-10`,title:`Isra Mikraj Nabi Muhammad saw.`,startDate:`2027-01-16`,endDate:`2027-01-16`,type:`libur_nasional`,description:`Libur Nasional`,semester:`genap`,colorCode:`#ef4444`,isEffectiveDay:!1},{id:`cal-11`,title:`Libur Awal Ramadan 1448 H`,startDate:`2027-02-08`,endDate:`2027-02-10`,type:`libur_nasional`,description:`Libur perkiraan awal puasa Ramadan`,semester:`genap`,colorCode:`#8b5cf6`,isEffectiveDay:!1},{id:`cal-12`,title:`Hari Raya Idulfitri 1448 H dan Cuti Bersama`,startDate:`2027-03-08`,endDate:`2027-03-16`,type:`libur_nasional`,description:`Libur Hari Raya Idulfitri 1448 H`,semester:`genap`,colorCode:`#dc2626`,isEffectiveDay:!1},{id:`cal-13`,title:`Asesmen Sumatif Akhir Tahun (ASAT) Genap`,startDate:`2027-06-07`,endDate:`2027-06-12`,type:`asesmen`,description:`Asesmen Sumatif Akhir Tahun (ASAT) Kelas 1–5; Kelas 6 melaksanakan Asesmen Sumatif Akhir Jenjang (ASAJ)`,semester:`genap`,colorCode:`#f59e0b`,isEffectiveDay:!1},{id:`cal-14`,title:`Pembagian Rapor Semester 2 / Kenaikan Kelas`,startDate:`2027-06-19`,endDate:`2027-06-19`,type:`kegiatan_sekolah`,description:`Titimangsa resmi rapor semester genap UPTD SPF SDN Lanas 1`,semester:`genap`,colorCode:`#10b981`,isEffectiveDay:!1},{id:`cal-15`,title:`Libur Akhir Tahun Pelajaran 2026/2027`,startDate:`2027-06-21`,endDate:`2027-07-10`,type:`libur_semester`,description:`Libur akhir tahun pelajaran menyambut TP 2027/2028`,semester:`genap`,colorCode:`#dc2626`,isEffectiveDay:!1}]},C=[{"id":"cp-bindo-fase-b","code":"CP-BINDO-B","fase":"B","targetGrades":[3,4],"subject":"Bahasa Indonesia","title":"Capaian Pembelajaran Bahasa Indonesia Fase B (Kelas III dan IV)","regulationReference":"Keputusan Kepala BSKAP Kemendikdasmen Nomor 046/H/KR/2025 Lampiran II","officialSource":"Salinan Kepka BSKAP 046/H/KR/2025, Lampiran II (Capaian Pembelajaran Bahasa Indonesia)","verified":true,"seedRev":"046-H-KR-2025","generalDescription":"Pada akhir Fase B, murid memiliki kemampuan sebagai berikut.","elements":[{"id":"elem-bindo-1","name":"Menyimak","description":"Memahami ide pokok suatu informasi dari teks nonsastra berbentuk teks aural (teks yang dibacakan dan/atau didengarkan); dan memahami isi teks sastra berbentuk teks aural."},{"id":"elem-bindo-2","name":"Membaca dan Memirsa","description":"Membaca kata-kata baru dengan fasih dari bacaan dan/atau tayangan yang dipirsa; dan memahami ide pokok, ide pendukung, pesan, dan informasi dalam teks sastra dan nonsastra berbentuk cetak dan/atau elektronik."},{"id":"elem-bindo-3","name":"Berbicara dan Mempresentasikan","description":"Menyajikan pendapat dengan pilihan kata dan sikap tubuh/gestur yang sesuai, menggunakan volume dan intonasi yang tepat sesuai konteks; menanggapi diskusi sesuai tata cara; dan menceritakan kembali isi dan/atau informasi dari berbagai tipe teks yang dibaca, dipirsa, atau didengar."},{"id":"elem-bindo-4","name":"Menulis","description":"Menulis berbagai tipe teks sederhana dengan rangkaian kalimat yang beragam; dan menggunakan kaidah kebahasaan dan kosakata baru yang memiliki makna denotatif untuk menulis teks sesuai dengan konteks."}],"teacherAnalysisNotes":"Fokus utama kelas 4 di SDN Lanas 1: Penguatan literasi kontekstual berbasis kearifan lokal pertanian dan alam pegunungan Botolinggo, peningkatan kosakata baru dan ekspresi lisan percaya diri.","updatedAt":"2026-10-22T00:00:00.000Z"},{"id":"cp-mat-fase-b","code":"CP-MAT-B","fase":"B","targetGrades":[3,4],"subject":"Matematika","title":"Capaian Pembelajaran Matematika Fase B (Kelas III dan IV)","regulationReference":"Keputusan Kepala BSKAP Kemendikdasmen Nomor 046/H/KR/2025 Lampiran II","officialSource":"Salinan Kepka BSKAP 046/H/KR/2025, Lampiran II (Capaian Pembelajaran Matematika)","verified":true,"seedRev":"046-H-KR-2025","generalDescription":"Pada akhir Fase B, murid memiliki kemampuan sebagai berikut.","elements":[{"id":"elem-mat-1","name":"Bilangan","description":"Memiliki pemahaman dan intuisi bilangan (number sense) pada bilangan cacah sampai 10.000; membaca, menulis, membandingkan, dan mengurutkan bilangan; menentukan dan menggunakan nilai tempat; melakukan komposisi dan dekomposisi bilangan cacah sampai 10.000. Murid dapat melakukan dan menyelesaikan masalah operasi bilangan penjumlahan dan pengurangan bilangan cacah sampai 1.000; melakukan dan menyelesaikan masalah operasi perkalian dan pembagian bilangan cacah sampai 100 dengan bantuan benda konkret, gambar dan simbol; mengenal kelipatan dan faktor. Murid dapat melakukan perbandingan dan pengurutan pecahan dengan pembilang satu dan antar pecahan dengan penyebut yang sama; mengenal dan dapat menerapkan pecahan senilai, memiliki intuisi pecahan dan desimal, serta dapat menentukan pecahan sebagai desimal dan persen."},{"id":"elem-mat-2","name":"Aljabar","description":"Menemukan nilai yang tidak diketahui dalam kalimat matematika yang melibatkan penjumlahan dan pengurangan pada bilangan cacah sampai 100, dengan menggunakan sifat-sifat bilangan dan operasinya. Murid dapat mengidentifikasi, meniru, dan mengembangkan pola gambar atau objek sederhana dan pola bilangan membesar dan mengecil yang dapat melibatkan penjumlahan dan pengurangan pada bilangan cacah sampai"},{"id":"elem-mat-3","name":"Pengukuran","description":"Mengukur panjang dan berat benda menggunakan satuan baku; menentukan hubungan antar-satuan baku panjang (cm, m) dan antar-satuan berat (g, kg); serta mengukur dan mengestimasi luas dan volume menggunakan satuan tidak baku dan satuan baku berupa bilangan cacah."},{"id":"elem-mat-4","name":"Geometri","description":"Mendeskripsikan ciri berbagai bentuk bangun datar (segiempat, segitiga, segi banyak); menyusun (komposisi) dan mengurai (dekomposisi) berbagai bangun datar dengan lebih dari satu cara jika memungkinkan."},{"id":"elem-mat-5","name":"Analisis Data dan Peluang","description":"Mengurutkan, membandingkan, menyajikan, menganalisis dan menginterpretasi data dalam bentuk tabel, diagram gambar, piktogram, dan diagram batang (skala satu satuan)."}],"teacherAnalysisNotes":"Penggunaan alat peraga konkret dari bahan alami sekitar sekolah (biji-bijian, stik bambu) untuk pemahaman konsep pecahan dan perkalian bermakna.","updatedAt":"2026-10-22T00:00:00.000Z"},{"id":"cp-ipas-fase-b","code":"CP-IPAS-B","fase":"B","targetGrades":[3,4],"subject":"IPAS (Ilmu Pengetahuan Alam dan Sosial)","title":"Capaian Pembelajaran IPAS (Ilmu Pengetahuan Alam dan Sosial) Fase B (Kelas III dan IV)","regulationReference":"Keputusan Kepala BSKAP Kemendikdasmen Nomor 046/H/KR/2025 Lampiran II","officialSource":"Salinan Kepka BSKAP 046/H/KR/2025, Lampiran II (Capaian Pembelajaran IPAS (Ilmu Pengetahuan Alam dan Sosial))","verified":true,"seedRev":"046-H-KR-2025","generalDescription":"Pada akhir Fase B, murid memiliki kemampuan sebagai berikut.","elements":[{"id":"elem-ipas-1","name":"Pemahaman IPAS","description":"Menjelaskan bentuk dan fungsi pancaindra; menganalisis siklus hidup makhluk hidup dan upaya pelestariannya; menghasilkan solusi untuk masalah yang berkaitan dengan pelestarian sumber daya alam sebagai upaya mitigasi perubahan iklim; menyimpulkan proses perubahan wujud zat; menjelaskan sumber dan bentuk energi, serta proses perubahan bentuk energi dalam kehidupan sehari-hari; membedakan jenis gaya dan pengaruhnya terhadap arah, gerak, dan bentuk benda; menjelaskan peran, tugas, dan tanggung jawab serta interaksi sosial yang terjadi di sekitar tempat tinggal dan sekolah; mengenali letak kabupaten/kota dan provinsi tempat tinggalnya dengan menggunakan peta konvensional/digital; mengklasifikasikan ragam bentang alam dan keterkaitannya dengan profesi masyarakat, ragam budaya serta upaya untuk melestarikannya; menganalisis sejarah masyarakat di lingkungan tempat tinggal; menjelaskan nilai mata uang dan fungsinya, serta cara mengelola keuangan secara bijak."},{"id":"elem-ipas-2","name":"Keterampilan Proses","description":"Mampu menerapkan keterampilan proses yang meliputi: • Mengamati Murid mengamati fenomena dan peristiwa secara sederhana dan dapat mencatat hasil pengamatannya. • Mempertanyakan dan Memprediksi Secara mandiri, murid mengajukan pertanyaan tentang hal-hal yang ingin diketahui saat melakukan pengamatan dan membuat prediksi berdasarkan pengetahuan yang dimiliki sebelumnya. • Merencanakan dan Melakukan Penyelidikan Dengan panduan pendidik, murid membuat rencana dan melakukan langkah-langkah operasional untuk menjawab pertanyaan yang diajukan. Murid melakukan observasi menggunakan alat bantu pengukuran sederhana. • Memproses, Menganalisis Data dan Informasi Dengan panduan pendidik, murid mengorganisasikan data dalam bentuk turus dan diagram gambar untuk menyajikan dan mengidentifikasi pola. Murid membandingkan antara hasil pengamatan dengan prediksi dan memberikan penjelasan. • Mengevaluasi dan Refleksi Murid melakukan refleksi terhadap penyelidikan yang sudah dilakukan. • Mengomunikasikan Hasil Murid mengomunikasikan hasil penyelidikan secara lisan dan tertulis dalam berbagai media."}],"teacherAnalysisNotes":"Memanfaatkan kebun sekolah dan ekosistem perbukitan Desa Lanas sebagai laboratorium hidup penyelidikan sains.","updatedAt":"2026-10-22T00:00:00.000Z"},{"id":"cp-pancasila-fase-b","code":"CP-PP-B","fase":"B","targetGrades":[3,4],"subject":"Pendidikan Pancasila","title":"Capaian Pembelajaran Pendidikan Pancasila Fase B (Kelas III dan IV)","regulationReference":"Keputusan Kepala BSKAP Kemendikdasmen Nomor 046/H/KR/2025 Lampiran II","officialSource":"Salinan Kepka BSKAP 046/H/KR/2025, Lampiran II (Capaian Pembelajaran Pendidikan Pancasila)","verified":true,"seedRev":"046-H-KR-2025","generalDescription":"Pada akhir Fase B, murid memiliki kemampuan sebagai berikut.","elements":[{"id":"elem-pp-1","name":"Pancasila","description":"Mengidentifikasi makna sila-sila Pancasila, dan penerapannya dalam kehidupan sehari-hari; mengenal karakter para perumus Pancasila; menunjukkan sikap bangga menjadi anak Indonesia yang memiliki bahasa Indonesia sebagai bahasa persatuan di lingkungan sekitar."},{"id":"elem-pp-2","name":"Undang-Undang Dasar Negara Republik Indonesia Tahun 1945","description":"Mengidentifikasi dan melaksanakan aturan di sekolah dan lingkungan tempat tinggal; mengidentifikasi dan menerapkan hak yang didapat dan kewajiban sebagai anggota keluarga dan sebagai warga sekolah."},{"id":"elem-pp-3","name":"Bhinneka Tunggal Ika","description":"Membedakan dan menghargai identitas, keluarga, dan teman-temannya sesuai budaya, suku bangsa, bahasa, agama dan kepercayaannya di lingkungan sekitar."},{"id":"elem-pp-4","name":"Negara Kesatuan Republik Indonesia","description":"Mengidentifikasi lingkungan tempat tinggal (RT, RW, desa atau kelurahan, dan kecamatan) sebagai bagian dari wilayah Negara Kesatuan Republik Indonesia; menunjukkan perilaku bekerja sama dalam berbagai bentuk keberagaman suku bangsa, sosial, dan budaya di Indonesia yang terikat persatuan dan kesatuan di lingkungan sekitar."}],"updatedAt":"2026-10-22T00:00:00.000Z"},{"id":"cp-pai-fase-b","code":"CP-PAI-B","fase":"B","targetGrades":[3,4],"subject":"Pendidikan Agama Islam dan Budi Pekerti","title":"Capaian Pembelajaran Pendidikan Agama Islam dan Budi Pekerti Fase B (Kelas III dan IV)","regulationReference":"Keputusan Kepala BKPDM Nomor 020 Tahun 2026 (perubahan atas Keputusan Kepala BSKAP Kemendikdasmen Nomor 046/H/KR/2025 Lampiran II)","officialSource":"Salinan Kepka BKPDM 020/2026, Lampiran I (Capaian Pembelajaran Pendidikan Agama Islam dan Budi Pekerti)","verified":true,"seedRev":"046-H-KR-2025+020-2026-r2","generalDescription":"Pada akhir Fase B, murid memiliki kemampuan sebagai berikut.","elements":[{"id":"elem-pai-1","name":"Al-Qur’an Hadis","description":"Membaca, menulis, dan membedakan huruf hijaiah bersambung; menghafal dan menjelaskan beberapa surah pendek, hadis tentang kewajiban salat dan menjaga hubungan baik dengan sesama."},{"id":"elem-pai-2","name":"Akidah","description":"Menjelaskan dan meyakini sifat-sifat Allah Swt., iman kepada kitab-kitab Allah Swt., beberapa asmaulhusna, dan iman kepada rasul-rasul Allah Swt."},{"id":"elem-pai-3","name":"Akhlak","description":"Menerapkan akhlak terhadap Allah Swt. dengan berbaik sangka kepada-Nya, akhlak terhadap orang tua, keluarga, dan guru."},{"id":"elem-pai-4","name":"Fikih","description":"Menerapkan azan dan ikamah, salat jumat dan salat sunah; menjelaskan balig dan tanggung jawab yang menyertainya (taklīf)."},{"id":"elem-pai-5","name":"Sejarah Peradaban Islam","description":"Menceritakan dan menjelaskan kisah Nabi Muhammad saw. sebelum dan sesudah menjadi rasul periode Makkah."}],"updatedAt":"2026-10-22T00:00:00.000Z"},{"id":"cp-pjok-fase-b","code":"CP-PJOK-B","fase":"B","targetGrades":[3,4],"subject":"Pendidikan Jasmani, Olahraga, dan Kesehatan","title":"Capaian Pembelajaran Pendidikan Jasmani, Olahraga, dan Kesehatan Fase B (Kelas III dan IV)","regulationReference":"Keputusan Kepala BSKAP Kemendikdasmen Nomor 046/H/KR/2025 Lampiran II","officialSource":"Salinan Kepka BSKAP 046/H/KR/2025, Lampiran II (Capaian Pembelajaran Pendidikan Jasmani, Olahraga, dan Kesehatan)","verified":true,"seedRev":"046-H-KR-2025","generalDescription":"Pada akhir Fase B, murid memiliki kemampuan sebagai berikut.","elements":[{"id":"elem-pjok-1","name":"Terampil Bergerak","description":"Menghaluskan keterampilan gerak fundamental dan menerapkannya dalam situasi gerak yang baru; menyesuaikan strategi gerak untuk mendapatkan capaian keterampilan gerak; dan memperagakan berbagai konsep gerak yang dapat diterapkan dalam rangkaian gerak."},{"id":"elem-pjok-2","name":"Belajar Melalui Gerak","description":"Menerapkan strategi gerak sederhana dan memecahkan masalah gerak; menerapkan peraturan untuk menumbuhkan fair play di dalam berbagai aktivitas jasmani; dan berpartisipasi secara positif dalam kelompok atau tim di dalam berbagai aktivitas jasmani."},{"id":"elem-pjok-3","name":"Bergaya Hidup Aktif","description":"Berpartisipasi dalam berbagai aktivitas jasmani dan mengenali faktor-faktor yang menyebabkan aktivitas jasmani menyenangkan."},{"id":"elem-pjok-4","name":"Memilih Hidup yang Menyehatkan","description":"Mengenali risiko kesehatan akibat gaya hidup dan berbagai aktivitas jasmani untuk pencegahannya; mengidentifikasi pola makan sehat dan bergizi seimbang sesuai rekomendasi kesehatan untuk menunjang aktivitas sehari-hari; dan mempraktikkan penanganan cedera ringan sesuai pemahaman tentang prinsip pertolongan pertama."}],"updatedAt":"2026-10-22T00:00:00.000Z"},{"id":"cp-musik-fase-b","code":"CP-MUSIK-B","fase":"B","targetGrades":[3,4],"subject":"Seni Musik","title":"Capaian Pembelajaran Seni Musik Fase B (Kelas III dan IV)","regulationReference":"Keputusan Kepala BSKAP Kemendikdasmen Nomor 046/H/KR/2025 Lampiran II","officialSource":"Salinan Kepka BSKAP 046/H/KR/2025, Lampiran II (Capaian Pembelajaran Seni Musik)","verified":true,"seedRev":"046-H-KR-2025","generalDescription":"Pada akhir Fase B, murid memiliki kemampuan sebagai berikut.","elements":[{"id":"elem-musik-1","name":"Mengalami (Experiencing)","description":"Mengenali nada dan pola irama menggunakan anggota tubuh maupun alat musik."},{"id":"elem-musik-2","name":"Merefleksikan (Reflecting)","description":"Melakukan umpan balik mengenai praktik bermusik diri sendiri atau orang lain menggunakan istilah musik."},{"id":"elem-musik-3","name":"Berpikir dan Bekerja Artistik (Thinking and Working Artistically)","description":"Menirukan pola irama dan melodi menggunakan alat musik ritmis atau melodis; menyebutkan karakteristik ragam alat musik dan bunyi yang dihasilkan; mengetahui cara memainkan dan merawat alat musik."},{"id":"elem-musik-4","name":"Menciptakan (Creating)","description":"Membuat bunyi menggunakan anggota tubuh atau alat musik ritmis dan melodis yang tersedia di lingkungan sekitar."},{"id":"elem-musik-5","name":"Berdampak (Impacting)","description":"Menunjukkan minat dalam kegiatan bermusik."}],"updatedAt":"2026-10-22T00:00:00.000Z"},{"id":"cp-rupa-fase-b","code":"CP-RUPA-B","fase":"B","targetGrades":[3,4],"subject":"Seni Rupa","title":"Capaian Pembelajaran Seni Rupa Fase B (Kelas III dan IV)","regulationReference":"Keputusan Kepala BSKAP Kemendikdasmen Nomor 046/H/KR/2025 Lampiran II","officialSource":"Salinan Kepka BSKAP 046/H/KR/2025, Lampiran II (Capaian Pembelajaran Seni Rupa)","verified":true,"seedRev":"046-H-KR-2025","generalDescription":"Pada akhir Fase B, murid memiliki kemampuan sebagai berikut.","elements":[{"id":"elem-rupa-1","name":"Mengalami (Experiencing)","description":"Mengidentifikasi unsur rupa dan prinsip desain dalam benda-benda di sekitar/karya seni rupa."},{"id":"elem-rupa-2","name":"Merefleksikan (Reflecting)","description":"Merefleksikan dan mengapresiasi karya diri sendiri dan teman sekelas menggunakan kosa kata seni rupa yang sesuai."},{"id":"elem-rupa-3","name":"Berpikir dan Bekerja Artistik (Thinking and Working Artistically)","description":"Mengenali dan menguji coba alat dan/atau bahan yang dimiliki serta prosedur penggunaannya."},{"id":"elem-rupa-4","name":"Menciptakan (Making/Creating)","description":"Membuat karya seni rupa berdasarkan pengalaman dan hasil pengamatan terhadap lingkungan sekitar."},{"id":"elem-rupa-5","name":"Berdampak (Impacting)","description":"Menghasilkan karya seni rupa yang berdampak pada perasaan atau mewakili harapannya."}],"updatedAt":"2026-10-22T00:00:00.000Z"},{"id":"cp-tari-fase-b","code":"CP-TARI-B","fase":"B","targetGrades":[3,4],"subject":"Seni Tari","title":"Capaian Pembelajaran Seni Tari Fase B (Kelas III dan IV)","regulationReference":"Keputusan Kepala BSKAP Kemendikdasmen Nomor 046/H/KR/2025 Lampiran II","officialSource":"Salinan Kepka BSKAP 046/H/KR/2025, Lampiran II (Capaian Pembelajaran Seni Tari)","verified":true,"seedRev":"046-H-KR-2025","generalDescription":"Pada akhir Fase B, murid memiliki kemampuan sebagai berikut.","elements":[{"id":"elem-tari-1","name":"Mengalami (Experiencing)","description":"Mengamati bentuk penyajian tari berdasarkan latar belakang serta mengeksplorasi unsur utama tari sesuai level gerak, dan perubahan arah hadap."},{"id":"elem-tari-2","name":"Merefleksikan (Reflecting)","description":"Mengidentifikasi unsur utama tari sesuai level gerak, dan perubahan arah hadap, serta menilai pencapaian diri saat melakukan aktivitas pembelajaran tari."},{"id":"elem-tari-3","name":"Berpikir dan Bekerja Artistik (Thinking and Working Artistically)","description":"Meragakan hasil tari dengan bekerja secara kooperatif untuk mengembangkan kemampuan bekerja sama dan saling menghargai demi tercapainya tujuan bersama."},{"id":"elem-tari-4","name":"Menciptakan (Creating)","description":"Mengembangkan gerak dengan unsur utama tari, level, dan perubahan arah hadap."},{"id":"elem-tari-5","name":"Berdampak (Impacting)","description":"Menerima proses pembelajaran sehingga tumbuh rasa ingin tahu dan dapat menunjukkan usaha yang berdampak pada kemampuan diri dalam menyelesaikan aktivitas pembelajaran tari."}],"updatedAt":"2026-10-22T00:00:00.000Z"},{"id":"cp-teater-fase-b","code":"CP-TEATER-B","fase":"B","targetGrades":[3,4],"subject":"Seni Teater","title":"Capaian Pembelajaran Seni Teater Fase B (Kelas III dan IV)","regulationReference":"Keputusan Kepala BSKAP Kemendikdasmen Nomor 046/H/KR/2025 Lampiran II","officialSource":"Salinan Kepka BSKAP 046/H/KR/2025, Lampiran II (Capaian Pembelajaran Seni Teater)","verified":true,"seedRev":"046-H-KR-2025","generalDescription":"Pada akhir Fase B, murid memiliki kemampuan sebagai berikut.","elements":[{"id":"elem-teater-1","name":"Mengalami (Experiencing)","description":"Mengenal teknik dasar akting (pemeranan) melalui proses meniru (mimesis), mengenal gerak tubuh, suara/vokal sesuai tokoh/peran atau perilaku objek sekitar."},{"id":"elem-teater-2","name":"Merefleksikan (Reflection)","description":"Mengenali lingkungan sekitarnya dan pengalaman dalam bermain teater."},{"id":"elem-teater-3","name":"Bekerja Secara Artistik (Thinking and Working Artistically)","description":"Menggunakan properti yang sesuai dengan tokoh yang diperankan."},{"id":"elem-teater-4","name":"Menciptakan (Creating)","description":"Mengamati berbagai peran, mengenal tokoh di sekitar, dan memainkan sebuah lakon dalam cerita."},{"id":"elem-teater-5","name":"Berdampak (Impacting)","description":"Mengenal bentuk lakon dalam bermain teater."}],"updatedAt":"2026-10-22T00:00:00.000Z"},{"id":"cp-ing-fase-b","code":"CP-ING-B","fase":"B","targetGrades":[3,4],"subject":"Bahasa Inggris","title":"Capaian Pembelajaran Bahasa Inggris Fase B (Kelas III dan IV)","regulationReference":"Keputusan Kepala BSKAP Kemendikdasmen Nomor 046/H/KR/2025 Lampiran II","officialSource":"Salinan Kepka BSKAP 046/H/KR/2025, Lampiran II (Capaian Pembelajaran Bahasa Inggris)","verified":true,"seedRev":"046-H-KR-2025","generalDescription":"Pada akhir Fase B, murid memiliki kemampuan sebagai berikut.","elements":[{"id":"elem-ing-1","name":"Menyimak - Berbicara (Listening - Speaking)","description":"Memahami dan merespon teks lisan atau teks multimodal sederhana tentang kehidupan sehari-hari baik secara verbal atau non-verbal sesuai konteks. (understand and respond to simple oral or multimodal texts about everyday life verbally or non-verbally in line with its context)"},{"id":"elem-ing-2","name":"Membaca - Memirsa (Reading - Viewing)","description":"Memahami teks tulis pendek sederhana atau teks multimodal tentang kehidupan sehari-hari dan meresponsnya secara verbal atau non-verbal sesuai konteks. (Understand simple short texts or multimodal texts about everyday life and respond to them verbally or non-verbally in line with its context)"},{"id":"elem-ing-3","name":"Menulis - Mempresentasikan (Writing - Presenting)","description":"Mengomunikasikan gagasan tentang topik sehari-hari dalam teks tulis pendek atau teks multimodal sesuai konteks. (Communicate their ideas on everyday life topics in simple written or multimodal texts in line with its context)"}],"updatedAt":"2026-10-22T00:00:00.000Z"},{"id":"cp-bindo-fase-a","code":"CP-BINDO-A","fase":"A","targetGrades":[1,2],"subject":"Bahasa Indonesia","title":"Capaian Pembelajaran Bahasa Indonesia Fase A (Kelas I dan II)","regulationReference":"Keputusan Kepala BSKAP Kemendikdasmen Nomor 046/H/KR/2025 Lampiran II","officialSource":"Salinan Kepka BSKAP 046/H/KR/2025, Lampiran II (Capaian Pembelajaran Bahasa Indonesia)","verified":true,"seedRev":"046-H-KR-2025","generalDescription":"Pada akhir Fase A, murid memiliki kemampuan sebagai berikut.","elements":[{"id":"elem-bindo-1","name":"Menyimak","description":"Memahami informasi dari teks nonsastra berbentuk teks aural (teks yang dibacakan dan/atau didengarkan) berupa percakapan yang berkaitan dengan diri, keluarga, dan/atau lingkungan sekitar; dan memahami pesan teks sastra berbentuk teks aural."},{"id":"elem-bindo-2","name":"Membaca dan Memirsa","description":"Membaca kata-kata sederhana dengan fasih dari bacaan dan/atau tayangan yang dipirsa tentang diri, keluarga, kesehatan, dan/atau lingkungan sekitar; dan memahami isi bacaan dan/atau tayangan yang dipirsa tentang diri, keluarga, kesehatan, dan/atau lingkungan sekitar."},{"id":"elem-bindo-3","name":"Berbicara dan Mempresentasikan","description":"Merespons dengan bertanya tentang sesuatu, menjawab, dan menanggapi komentar orang lain (teman, pendidik, dan/atau orang dewasa) dengan baik dan santun dalam suatu percakapan tentang diri, keluarga, kesehatan, dan/atau lingkungan sekitar; mengungkapkan perasaan dan gagasan secara lisan dengan atau tanpa bantuan gambar; dan menceritakan kembali isi berbagai tipe teks yang dibaca, dipirsa, atau didengar tentang diri, keluarga, kesehatan, dan/atau lingkungan sekitar."},{"id":"elem-bindo-4","name":"Menulis","description":"Menulis permulaan dengan benar di atas kertas dan/atau melalui media digital; mengembangkan tulisan tangan yang semakin baik; dan menulis berbagai tipe teks sederhana tentang diri, keluarga, dan/atau lingkungan sekitar dengan beberapa kalimat sederhana."}],"updatedAt":"2026-10-22T00:00:00.000Z"},{"id":"cp-mat-fase-a","code":"CP-MAT-A","fase":"A","targetGrades":[1,2],"subject":"Matematika","title":"Capaian Pembelajaran Matematika Fase A (Kelas I dan II)","regulationReference":"Keputusan Kepala BSKAP Kemendikdasmen Nomor 046/H/KR/2025 Lampiran II","officialSource":"Salinan Kepka BSKAP 046/H/KR/2025, Lampiran II (Capaian Pembelajaran Matematika)","verified":true,"seedRev":"046-H-KR-2025","generalDescription":"Pada akhir Fase A, murid memiliki kemampuan sebagai berikut.","elements":[{"id":"elem-mat-1","name":"Bilangan","description":"Menunjukkan pemahaman dan memiliki intuisi bilangan (number sense) pada bilangan cacah sampai 100; membaca, menulis, menentukan nilai tempat, membandingkan, mengurutkan, serta melakukan komposisi (menyusun) dan dekomposisi (mengurai) bilangan; melakukan operasi penjumlahan dan pengurangan menggunakan benda-benda konkret yang banyaknya sampai 20; dan menunjukkan pemahaman pecahan sebagai bagian dari keseluruhan melalui konteks membagi sebuah benda atau kumpulan benda sama banyak (pecahan yang diperkenalkan adalah setengah dan seperempat)."},{"id":"elem-mat-2","name":"Aljabar","description":"Menunjukan pemahaman makna simbol matematika \"=\" dalam suatu kalimat matematika yang terkait dengan penjumlahan dan pengurangan bilangan cacah sampai 20 menggunakan gambar. Contoh: Murid dapat mengenali, meniru, dan melanjutkan pola bukan bilangan (misalnya, gambar, warna, bunyi/suara)."},{"id":"elem-mat-3","name":"Pengukuran","description":"Membandingkan panjang dan berat benda secara langsung, dan membandingkan durasi waktu; mengukur dan mengestimasi panjang dan berat benda menggunakan satuan tidak baku."},{"id":"elem-mat-4","name":"Geometri","description":"Mengenal berbagai bangun datar (segitiga, segiempat, segi banyak, lingkaran) dan bangun ruang (balok, kubus, kerucut, dan bola); melakukan komposisi (penyusunan) dan dekomposisi (penguraian) suatu bangun datar (segitiga, segiempat, dan segi banyak); dan menentukan posisi benda terhadap benda lain (kanan, kiri, depan belakang, bawah, atas)."},{"id":"elem-mat-5","name":"Analisis Data dan Peluang","description":"Mengurutkan, menyortir, mengelompokkan, membandingkan, dan menyajikan data dari banyak benda dengan menggunakan turus dan piktogram paling banyak 4 kategori."}],"updatedAt":"2026-10-22T00:00:00.000Z"},{"id":"cp-pp-fase-a","code":"CP-PP-A","fase":"A","targetGrades":[1,2],"subject":"Pendidikan Pancasila","title":"Capaian Pembelajaran Pendidikan Pancasila Fase A (Kelas I dan II)","regulationReference":"Keputusan Kepala BSKAP Kemendikdasmen Nomor 046/H/KR/2025 Lampiran II","officialSource":"Salinan Kepka BSKAP 046/H/KR/2025, Lampiran II (Capaian Pembelajaran Pendidikan Pancasila)","verified":true,"seedRev":"046-H-KR-2025","generalDescription":"Pada akhir Fase A, murid memiliki kemampuan sebagai berikut.","elements":[{"id":"elem-pp-1","name":"Pancasila","description":"Mengenal bendera negara, lagu kebangsaan, simbol dan sila-sila Pancasila dalam lambang negara Garuda Pancasila dan simbol Pancasila beserta sila-sila Pancasila; menerapkan nilai-nilai Pancasila di lingkungan keluarga."},{"id":"elem-pp-2","name":"Undang-Undang Dasar Negara Republik Indonesia Tahun 1945","description":"Mengenal aturan di lingkungan keluarga; menunjukkan dan menceritakan sikap mematuhi aturan di lingkungan keluarga."},{"id":"elem-pp-3","name":"Bhinneka Tunggal Ika","description":"Mengenal semboyan Bhinneka Tunggal Ika; mengidentifikasi dan menghargai identitas dirinya sesuai dengan jenis kelamin, hobi, bahasa, serta agama dan kepercayaan di lingkungan sekitar."},{"id":"elem-pp-4","name":"Negara Kesatuan Republik Indonesia","description":"Mengenal karakteristik lingkungan tempat tinggal dan sekolah, sebagai bagian dari wilayah Negara Kesatuan Republik Indonesia; menceritakan dan mempraktikkan bekerja sama menjaga lingkungan sekitar dalam keberagaman."}],"updatedAt":"2026-10-22T00:00:00.000Z"},{"id":"cp-pai-fase-a","code":"CP-PAI-A","fase":"A","targetGrades":[1,2],"subject":"Pendidikan Agama Islam dan Budi Pekerti","title":"Capaian Pembelajaran Pendidikan Agama Islam dan Budi Pekerti Fase A (Kelas I dan II)","regulationReference":"Keputusan Kepala BKPDM Nomor 020 Tahun 2026 (perubahan atas Keputusan Kepala BSKAP Kemendikdasmen Nomor 046/H/KR/2025 Lampiran II)","officialSource":"Salinan Kepka BKPDM 020/2026, Lampiran I (Capaian Pembelajaran Pendidikan Agama Islam dan Budi Pekerti)","verified":true,"seedRev":"046-H-KR-2025+020-2026-r2","generalDescription":"Pada akhir Fase A, murid memiliki kemampuan sebagai berikut.","elements":[{"id":"elem-pai-1","name":"Al-Qur’an Hadis","description":"Membaca dan membedakan huruf hijaiah berharakat, huruf hijaiah bersambung; menghafal Surah al-Fātiḥah, beberapa surah pendek Al-Qur’an, dan hadis tentang kebersihan."},{"id":"elem-pai-2","name":"Akidah","description":"Menjelaskan dan meyakini rukun iman, iman kepada Allah Swt., beberapa asmaulhusna, dan iman kepada malaikat."},{"id":"elem-pai-3","name":"Akhlak","description":"Menerapkan akhlak terhadap Allah Swt. dengan menyucikan dan memuji-Nya, dan akhlak terhadap diri sendiri."},{"id":"elem-pai-4","name":"Fikih","description":"Menerapkan rukun Islam, syahadatain, tata cara bersuci, salat fardu, zikir dan berdoa setelah salat."},{"id":"elem-pai-5","name":"Sejarah Peradaban Islam","description":"Menceritakan kisah keteladanan beberapa nabi dan rasul."}],"updatedAt":"2026-10-22T00:00:00.000Z"},{"id":"cp-pjok-fase-a","code":"CP-PJOK-A","fase":"A","targetGrades":[1,2],"subject":"Pendidikan Jasmani, Olahraga, dan Kesehatan","title":"Capaian Pembelajaran Pendidikan Jasmani, Olahraga, dan Kesehatan Fase A (Kelas I dan II)","regulationReference":"Keputusan Kepala BSKAP Kemendikdasmen Nomor 046/H/KR/2025 Lampiran II","officialSource":"Salinan Kepka BSKAP 046/H/KR/2025, Lampiran II (Capaian Pembelajaran Pendidikan Jasmani, Olahraga, dan Kesehatan)","verified":true,"seedRev":"046-H-KR-2025","generalDescription":"Pada akhir Fase A, murid memiliki kemampuan sebagai berikut.","elements":[{"id":"elem-pjok-1","name":"Terampil Bergerak","description":"Mempraktikkan keterampilan gerak fundamental dan menerapkannya dalam berbagai situasi gerak yang berbeda; mengeksplorasi berbagai strategi gerak; dan mengeksplorasi berbagai konsep gerak serta menyimpulkan efektivitasnya."},{"id":"elem-pjok-2","name":"Belajar Melalui Gerak","description":"Menaati peraturan untuk menumbuhkan fair play di dalam berbagai aktivitas jasmani; menerapkan strategi kolaborasi ketika berpartisipasi dalam aktivitas jasmani."},{"id":"elem-pjok-3","name":"Bergaya Hidup Aktif","description":"Berpartisipasi di dalam berbagai aktivitas jasmani dan mengidentifikasi manfaatnya."},{"id":"elem-pjok-4","name":"Memilih Hidup yang Menyehatkan","description":"Mengenali gaya hidup aktif dan sehat; mengenali manfaat komponen makanan bergizi seimbang; serta mengenali situasi dan potensi yang berisiko terhadap kesehatan dan keselamatan serta strategi mencari bantuan kepada orang dewasa terpercaya."}],"updatedAt":"2026-10-22T00:00:00.000Z"},{"id":"cp-musik-fase-a","code":"CP-MUSIK-A","fase":"A","targetGrades":[1,2],"subject":"Seni Musik","title":"Capaian Pembelajaran Seni Musik Fase A (Kelas I dan II)","regulationReference":"Keputusan Kepala BSKAP Kemendikdasmen Nomor 046/H/KR/2025 Lampiran II","officialSource":"Salinan Kepka BSKAP 046/H/KR/2025, Lampiran II (Capaian Pembelajaran Seni Musik)","verified":true,"seedRev":"046-H-KR-2025","generalDescription":"Pada akhir Fase A, murid memiliki kemampuan sebagai berikut.","elements":[{"id":"elem-musik-1","name":"Mengalami (Experiencing)","description":"Mengenali unsur-unsur musik (nada dan irama) menggunakan anggota tubuh maupun alat musik."},{"id":"elem-musik-2","name":"Merefleksikan (Reflecting)","description":"Melakukan umpan balik mengenai praktik bermain musik diri sendiri atau orang lain menggunakan bahasa sehari-hari."},{"id":"elem-musik-3","name":"Berpikir dan Bekerja Artistik (Thinking and Working Artistically)","description":"Menirukan pola irama dan nada menggunakan alat musik ritmis atau melodis; mengenali ragam alat musik dan bunyi yang dihasilkan; mengenali cara memainkan dan membersihkan instrumen/alat musik."},{"id":"elem-musik-4","name":"Menciptakan (Creating)","description":"Membuat pola irama menggunakan anggota tubuh atau alat musik ritmis yang tersedia di lingkungan sekitar."},{"id":"elem-musik-5","name":"Berdampak (Impacting)","description":"Menunjukkan ekspresi senang dalam kegiatan bermusik."}],"updatedAt":"2026-10-22T00:00:00.000Z"},{"id":"cp-rupa-fase-a","code":"CP-RUPA-A","fase":"A","targetGrades":[1,2],"subject":"Seni Rupa","title":"Capaian Pembelajaran Seni Rupa Fase A (Kelas I dan II)","regulationReference":"Keputusan Kepala BSKAP Kemendikdasmen Nomor 046/H/KR/2025 Lampiran II","officialSource":"Salinan Kepka BSKAP 046/H/KR/2025, Lampiran II (Capaian Pembelajaran Seni Rupa)","verified":true,"seedRev":"046-H-KR-2025","generalDescription":"Pada akhir Fase A, murid memiliki kemampuan sebagai berikut.","elements":[{"id":"elem-rupa-1","name":"Mengalami (Experiencing)","description":"Mengenali dan menyebutkan unsur-unsur rupa dalam benda-benda di sekitar/karya seni rupa."},{"id":"elem-rupa-2","name":"Merefleksikan (Reflecting)","description":"Merefleksikan dan mengapresiasi karya diri sendiri."},{"id":"elem-rupa-3","name":"Berpikir dan Bekerja Artistik (Thinking and Working Artistically)","description":"Mengenali dan menguji coba alat dan/atau bahan yang dimiliki."},{"id":"elem-rupa-4","name":"Menciptakan (Making/Creating)","description":"Membuat karya seni rupa berdasarkan pengalaman dan hasil pengamatan terhadap lingkungan sekitar."},{"id":"elem-rupa-5","name":"Berdampak (Impacting)","description":"Menghasilkan karya seni rupa yang berdampak pada perasaan dirinya."}],"updatedAt":"2026-10-22T00:00:00.000Z"},{"id":"cp-tari-fase-a","code":"CP-TARI-A","fase":"A","targetGrades":[1,2],"subject":"Seni Tari","title":"Capaian Pembelajaran Seni Tari Fase A (Kelas I dan II)","regulationReference":"Keputusan Kepala BSKAP Kemendikdasmen Nomor 046/H/KR/2025 Lampiran II","officialSource":"Salinan Kepka BSKAP 046/H/KR/2025, Lampiran II (Capaian Pembelajaran Seni Tari)","verified":true,"seedRev":"046-H-KR-2025","generalDescription":"Pada akhir Fase A, murid memiliki kemampuan sebagai berikut.","elements":[{"id":"elem-tari-1","name":"Mengalami (Experiencing)","description":"Mengenal bentuk tari sebagai media komunikasi serta mengembangkan kesadaran diri dalam bereksplorasi unsur utama tari meliputi gerak, ruang, tenaga, waktu, gerak di tempat dan gerak berpindah."},{"id":"elem-tari-2","name":"Merefleksikan (Reflecting)","description":"Mengidentifikasi unsur utama tari meliputi gerak, ruang, tenaga, waktu, gerak di tempat dan gerak berpindah, serta mengemukakan pencapaian diri secara lisan, tulisan, dan kinestetik."},{"id":"elem-tari-3","name":"Berpikir dan Bekerja Artistik (Thinking and Working Artistically)","description":"Meragakan hasil gerak berdasarkan etika sebagai penampil dan penonton dengan keyakinan dan percaya diri saat mengekspresikan ide, perasaan kepada penonton atau lingkungan sekitar."},{"id":"elem-tari-4","name":"Menciptakan (Creating)","description":"Mengembangkan unsur utama tari (gerak, ruang, waktu, dan tenaga), gerak di tempat, dan gerak berpindah untuk membuat gerak sederhana yang memiliki kesatuan gerak yang indah."},{"id":"elem-tari-5","name":"Berdampak (Impacting)","description":"Menerima proses pembelajaran sehingga tumbuh rasa ingin tahu dan dapat menunjukkan antusiasme yang berdampak pada kemampuan diri dalam menyelesaikan aktivitas pembelajaran tari."}],"updatedAt":"2026-10-22T00:00:00.000Z"},{"id":"cp-teater-fase-a","code":"CP-TEATER-A","fase":"A","targetGrades":[1,2],"subject":"Seni Teater","title":"Capaian Pembelajaran Seni Teater Fase A (Kelas I dan II)","regulationReference":"Keputusan Kepala BSKAP Kemendikdasmen Nomor 046/H/KR/2025 Lampiran II","officialSource":"Salinan Kepka BSKAP 046/H/KR/2025, Lampiran II (Capaian Pembelajaran Seni Teater)","verified":true,"seedRev":"046-H-KR-2025","generalDescription":"Pada akhir Fase A, murid memiliki kemampuan sebagai berikut.","elements":[{"id":"elem-teater-1","name":"Mengalami (Experiencing)","description":"Mengamati, merespons, meniru gerak tubuh dan suara sebagai media untuk mengomunikasikan emosi."},{"id":"elem-teater-2","name":"Merefleksikan (Reflection)","description":"Mengenali pengalaman dan emosi selama proses berseni teater serta menceritakan sebuah karya dengan kosakata sehari-hari."},{"id":"elem-teater-3","name":"Berpikir dan Bekerja Artistik (Thinking and Working Artistically)","description":"Mengenal jenis-jenis properti/alat bantu yang dapat mendukung cerita/permainan peran."},{"id":"elem-teater-4","name":"Menciptakan (Creating)","description":"Mengeksplorasi beragam peran mengenai tokoh di sekitar atau rekaan, dan memainkan sebuah lakon pertunjukan."},{"id":"elem-teater-5","name":"Berdampak (Impacting)","description":"Memainkan gerak dan lagu sesuai arahan dari pendidik."}],"updatedAt":"2026-10-22T00:00:00.000Z"},{"id":"cp-bindo-fase-c","code":"CP-BINDO-C","fase":"C","targetGrades":[5,6],"subject":"Bahasa Indonesia","title":"Capaian Pembelajaran Bahasa Indonesia Fase C (Kelas V dan VI)","regulationReference":"Keputusan Kepala BSKAP Kemendikdasmen Nomor 046/H/KR/2025 Lampiran II","officialSource":"Salinan Kepka BSKAP 046/H/KR/2025, Lampiran II (Capaian Pembelajaran Bahasa Indonesia)","verified":true,"seedRev":"046-H-KR-2025","generalDescription":"Pada akhir Fase C, murid memiliki kemampuan sebagai berikut.","elements":[{"id":"elem-bindo-1","name":"Menyimak","description":"Menganalisis informasi dari teks nonsastra berbentuk teks aural (teks yang dibacakan dan/atau didengarkan; dan menganalisis isi teks sastra berbentuk teks aural."},{"id":"elem-bindo-2","name":"Membaca dan Memirsa","description":"Membaca kata-kata dengan berbagai pola kombinasi huruf dengan fasih dari bacaan dan/atau tayangan yang dipirsa; dan menganalisis informasi serta nilai-nilai dalam teks sastra dan nonsastra berwujud teks visual dan/atau audiovisual."},{"id":"elem-bindo-3","name":"Berbicara dan Mempresentasikan","description":"Mempresentasikan gagasan dari berbagai tipe teks dengan efektif dan santun; dan menyampaikan perasaan berdasarkan fakta, imajinasi (dari diri sendiri dan orang lain) secara indah dan menarik dalam bentuk teks sastra dengan penggunaan kosakata secara kreatif."},{"id":"elem-bindo-4","name":"Menulis","description":"Menulis berbagai tipe teks sederhana berdasarkan gagasan, hasil pengamatan, pengalaman, dan/atau imajinasi dengan rangkaian kalimat kompleks secara kreatif, menarik, dan/atau indah; dan menggunakan kaidah kebahasaan dan kosakata baru yang memiliki makna denotatif dan konotatif."}],"updatedAt":"2026-10-22T00:00:00.000Z"},{"id":"cp-mat-fase-c","code":"CP-MAT-C","fase":"C","targetGrades":[5,6],"subject":"Matematika","title":"Capaian Pembelajaran Matematika Fase C (Kelas V dan VI)","regulationReference":"Keputusan Kepala BSKAP Kemendikdasmen Nomor 046/H/KR/2025 Lampiran II","officialSource":"Salinan Kepka BSKAP 046/H/KR/2025, Lampiran II (Capaian Pembelajaran Matematika)","verified":true,"seedRev":"046-H-KR-2025","generalDescription":"Pada akhir Fase C, murid memiliki kemampuan sebagai berikut.","elements":[{"id":"elem-mat-1","name":"Bilangan","description":"Menunjukkan pemahaman dan intuisi bilangan (number sense) pada bilangan cacah sampai 1.000.000; membaca, menulis, menentukan nilai tempat, membandingkan, mengurutkan, melakukan komposisi dan dekomposisi bilangan; menyelesaikan masalah yang berkaitan dengan uang; melakukan operasi penjumlahan, pengurangan, perkalian, dan pembagian bilangan cacah sampai 100.000; serta menyelesaikan masalah yang berkaitan dengan KPK dan FPB. Murid dapat membandingkan dan mengurutkan berbagai pecahan termasuk pecahan campuran, melakukan operasi penjumlahan dan pengurangan pecahan, serta melakukan operasi perkalian dan pembagian pecahan dengan bilangan asli; mengubah pecahan menjadi berbagai bentuk pecahan lain, serta membandingkan dan mengurutkan bilangan desimal (satu angka di belakang koma)."},{"id":"elem-mat-2","name":"Aljabar","description":"Menemukan nilai yang belum diketahui dalam kalimat matematika yang melibatkan penjumlahan, pengurangan, perkalian, dan pembagian pada bilangan cacah sampai 1000 dengan menggunakan sifat-sifat bilangan dan operasinya. Murid dapat mengidentifikasi, meniru, dan mengembangkan pola bilangan membesar dan mengecil yang melibatkan perkalian dan pembagian; bernalar secara proporsional untuk menyelesaikan masalah sehari-hari dengan rasio satuan; menggunakan operasi perkalian dan pembagian dalam menyelesaikan masalah sehari-hari yang terkait dengan proporsi."},{"id":"elem-mat-3","name":"Pengukuran","description":"Menentukan keliling dan luas berbagai bentuk bangun datar (segitiga, segiempat, dan segi banyak) serta gabungannya; menghitung durasi waktu dan mengukur besar sudut pada bangun datar atau yang dibentuk dari dua garis berpotongan."},{"id":"elem-mat-4","name":"Geometri","description":"Mengkonstruksi dan mengurai bangun ruang (kubus, balok, dan gabungannya) dan mengenali visualisasi spasial (bagian depan, atas, dan samping); membandingkan karakteristik antar bangun datar dan antar bangun ruang; serta menentukan lokasi pada peta yang menggunakan sistem berpetak."},{"id":"elem-mat-5","name":"Analisis Data dan Peluang","description":"Mengurutkan, membandingkan, menyajikan, dan menganalisis data banyak benda dan data hasil pengukuran dalam bentuk gambar, piktogram, diagram batang, dan tabel frekuensi untuk mendapatkan informasi; menentukan kejadian dengan kemungkinan yang lebih besar atau lebih kecil dalam suatu percobaan acak."}],"updatedAt":"2026-10-22T00:00:00.000Z"},{"id":"cp-ipas-fase-c","code":"CP-IPAS-C","fase":"C","targetGrades":[5,6],"subject":"IPAS (Ilmu Pengetahuan Alam dan Sosial)","title":"Capaian Pembelajaran IPAS (Ilmu Pengetahuan Alam dan Sosial) Fase C (Kelas V dan VI)","regulationReference":"Keputusan Kepala BSKAP Kemendikdasmen Nomor 046/H/KR/2025 Lampiran II","officialSource":"Salinan Kepka BSKAP 046/H/KR/2025, Lampiran II (Capaian Pembelajaran IPAS (Ilmu Pengetahuan Alam dan Sosial))","verified":true,"seedRev":"046-H-KR-2025","generalDescription":"Pada akhir Fase C, murid memiliki kemampuan sebagai berikut.","elements":[{"id":"elem-ipas-1","name":"Pemahaman IPAS","description":"Merefleksikan sistem organ tubuh manusia yang dikaitkan dengan cara menjaga kesehatan tubuhnya; menganalisis hubungan antar komponen biotik dan abiotik, serta pengaruhnya terhadap ekosistem; menjelaskan fenomena gelombang bunyi dan cahaya dalam kehidupan sehari-hari; menghasilkan upaya penghematan energi, serta pemanfaatan sumber energi alternatif dari sumber daya yang ada di sekitarnya sebagai upaya mitigasi perubahan iklim; menjelaskan sistem tata surya, serta kaitannya dengan rotasi dan revolusi bumi; menjelaskan letak dan kondisi geografis negara Indonesia dengan menggunakan peta konvensional/digital; meninjau sejarah perjuangan para pahlawan di lingkungan sekitar tempat tinggalnya; menemukan keragaman budaya nasional dalam konteks kebhinekaan berdasarkan pemahaman terhadap nilai-nilai kearifan lokal yang berlaku di wilayah tempat tinggal; serta menerapkan kegiatan ekonomi masyarakat di lingkungan sekitar."},{"id":"elem-ipas-2","name":"Keterampilan Proses","description":"Mampu menerapkan keterampilan proses yang meliputi: • Mengamati Murid mengamati fenomena dan peristiwa secara sederhana, mencatat hasil pengamatannya, serta mencari persamaan dan perbedaannya. • Mempertanyakan dan Memprediksi Dengan panduan pendidik, murid mengidentifikasi pertanyaan yang dapat diselidiki secara ilmiah dan membuat prediksinya. • Merencanakan dan Melakukan Penyelidikan Secara mandiri, murid merencanakan dan melakukan langkah-langkah operasional untuk menjawab pertanyaan yang diajukan. Murid melakukan observasi menggunakan alat bantu pengukuran sederhana. • Memproses serta Menganalisis Data dan Informasi Murid mengolah data dalam bentuk tabel dan grafik, serta menjelaskan hasil pengamatan dan pola atau hubungan pada"}],"updatedAt":"2026-10-22T00:00:00.000Z"},{"id":"cp-pp-fase-c","code":"CP-PP-C","fase":"C","targetGrades":[5,6],"subject":"Pendidikan Pancasila","title":"Capaian Pembelajaran Pendidikan Pancasila Fase C (Kelas V dan VI)","regulationReference":"Keputusan Kepala BSKAP Kemendikdasmen Nomor 046/H/KR/2025 Lampiran II","officialSource":"Salinan Kepka BSKAP 046/H/KR/2025, Lampiran II (Capaian Pembelajaran Pendidikan Pancasila)","verified":true,"seedRev":"046-H-KR-2025","generalDescription":"Pada akhir Fase C, murid memiliki kemampuan sebagai berikut.","elements":[{"id":"elem-pp-1","name":"Pancasila","description":"Memahami kronologi sejarah kelahiran Pancasila; meneladani sikap para perumus Pancasila dan menerapkan di lingkungan masyarakat; menghubungkan sila-sila dalam Pancasila sebagai suatu kesatuan yang utuh; menguraikan makna nilai-nilai Pancasila sebagai dasar negara, dan pandangan hidup bangsa."},{"id":"elem-pp-2","name":"Undang-Undang Dasar Negara Republik Indonesia Tahun 1945","description":"Mengimplementasikan bentuk-bentuk norma, hak, dan kewajiban dalam kedudukannya sebagai warga negara; mengenal Pembukaan Undang-Undang Dasar Negara Republik Indonesia tahun 1945; mempraktikkan musyawarah untuk membuat kesepakatan dan aturan bersama, serta menerapkannya dalam lingkungan keluarga dan sekolah."},{"id":"elem-pp-3","name":"Bhinneka Tunggal Ika","description":"Menyajikan hasil identifikasi sikap menghormati, menjaga, dan melestarikan keberagaman budaya sesuai semboyan dalam bingkai Bhinneka Tunggal Ika di lingkungan sekitar."},{"id":"elem-pp-4","name":"Negara Kesatuan Republik Indonesia","description":"Mengenal wilayahnya dalam konteks kabupaten/kota, dan provinsi sebagai bagian dari wilayah Negara Kesatuan Republik Indonesia; menunjukkan perilaku gotong royong untuk menjaga persatuan di lingkungan sekolah dan sekitar sebagai wujud bela negara."}],"updatedAt":"2026-10-22T00:00:00.000Z"},{"id":"cp-pai-fase-c","code":"CP-PAI-C","fase":"C","targetGrades":[5,6],"subject":"Pendidikan Agama Islam dan Budi Pekerti","title":"Capaian Pembelajaran Pendidikan Agama Islam dan Budi Pekerti Fase C (Kelas V dan VI)","regulationReference":"Keputusan Kepala BKPDM Nomor 020 Tahun 2026 (perubahan atas Keputusan Kepala BSKAP Kemendikdasmen Nomor 046/H/KR/2025 Lampiran II)","officialSource":"Salinan Kepka BKPDM 020/2026, Lampiran I (Capaian Pembelajaran Pendidikan Agama Islam dan Budi Pekerti)","verified":true,"seedRev":"046-H-KR-2025+020-2026-r2","generalDescription":"Pada akhir Fase C, murid memiliki kemampuan sebagai berikut.","elements":[{"id":"elem-pai-1","name":"Al-Qur’an Hadis","description":"Membaca, menulis, dan membedakan huruf hijaiah bersambung; menjelaskan beberapa surah pendek dan hadis tentang berbuat baik kepada orang tua, guru, dan teman."},{"id":"elem-pai-2","name":"Akidah","description":"Menjelaskan dan meyakini beberapa asmaulhusna, iman kepada hari akhir, iman kepada qada’ dan qadar."},{"id":"elem-pai-3","name":"Akhlak","description":"Menerapkan akhlak terhadap Allah Swt. dengan berdoa dan bertawakal kepada-Nya, akhlak terhadap teman, tetangga, non-muslim, hewan, dan tumbuhan."},{"id":"elem-pai-4","name":"Fikih","description":"Menerapkan puasa wajib dan sunah, makanan minuman yang halal dan haram, zakat, infak, sedekah, dan wakaf."},{"id":"elem-pai-5","name":"Sejarah Peradaban Islam","description":"Menceritakan dan menjelaskan kisah Nabi Muhammad saw. periode Madinah dan khulafaurasyidin."}],"updatedAt":"2026-10-22T00:00:00.000Z"},{"id":"cp-pjok-fase-c","code":"CP-PJOK-C","fase":"C","targetGrades":[5,6],"subject":"Pendidikan Jasmani, Olahraga, dan Kesehatan","title":"Capaian Pembelajaran Pendidikan Jasmani, Olahraga, dan Kesehatan Fase C (Kelas V dan VI)","regulationReference":"Keputusan Kepala BSKAP Kemendikdasmen Nomor 046/H/KR/2025 Lampiran II","officialSource":"Salinan Kepka BSKAP 046/H/KR/2025, Lampiran II (Capaian Pembelajaran Pendidikan Jasmani, Olahraga, dan Kesehatan)","verified":true,"seedRev":"046-H-KR-2025","generalDescription":"Pada akhir Fase C, murid memiliki kemampuan sebagai berikut.","elements":[{"id":"elem-pjok-1","name":"Terampil Bergerak","description":"Menyesuaikan keterampilan gerak melintasi berbagai situasi gerak; mentransfer strategi gerak yang sudah dikuasai ke dalam berbagai situasi gerak yang berbeda; dan menginvestigasi berbagai konsep gerak yang dapat diterapkan untuk meningkatkan capaian keterampilan gerak"},{"id":"elem-pjok-2","name":"Belajar Melalui Gerak","description":"Menguji efektivitas penerapan strategi gerak dalam berbagai situasi gerak; merancang peraturan alternatif dan modifikasi permainan untuk mendukung fair play dan partisipasi inklusif; dan menjalankan berbagai peran untuk mencapai keberhasilan kelompok atau tim di dalam berbagai aktivitas jasmani."},{"id":"elem-pjok-3","name":"Bergaya Hidup Aktif","description":"Berpartisipasi dalam aktivitas jasmani dan menjelaskan pengaruh aktivitas jasmani yang teratur terhadap kesehatan; mengidentifikasi rekomendasi aktivitas jasmani serta pencegahan perilaku sedenter."},{"id":"elem-pjok-4","name":"Memilih Hidup yang Menyehatkan","description":"Mengidentifikasi dan menghubungkan antara gaya hidup, risiko kesehatan, dan aktivitas pencegahannya sesuai rekomendasi otoritas kesehatan; menjelaskan pola makan sehat untuk menunjang aktivitas jasmani berdasarkan informasi kandungan gizi pada makanan; dan mempraktikkan penanganan cedera sedang sesuai pemahaman tentang prinsip pertolongan pertama."}],"updatedAt":"2026-10-22T00:00:00.000Z"},{"id":"cp-musik-fase-c","code":"CP-MUSIK-C","fase":"C","targetGrades":[5,6],"subject":"Seni Musik","title":"Capaian Pembelajaran Seni Musik Fase C (Kelas V dan VI)","regulationReference":"Keputusan Kepala BSKAP Kemendikdasmen Nomor 046/H/KR/2025 Lampiran II","officialSource":"Salinan Kepka BSKAP 046/H/KR/2025, Lampiran II (Capaian Pembelajaran Seni Musik)","verified":true,"seedRev":"046-H-KR-2025","generalDescription":"Pada akhir Fase C, murid memiliki kemampuan sebagai berikut.","elements":[{"id":"elem-musik-1","name":"Mengalami (Experiencing)","description":"Mengenali dan menerapkan unsur-unsur musik (nada, irama dan melodi) menggunakan alat musik ritmis dan melodis serta menunjukkan tingkat kepekaan akan unsur-unsur musik dengan menggunakan alat musik ritmis dan melodis."},{"id":"elem-musik-2","name":"Merefleksikan (Reflecting)","description":"Melakukan umpan balik mengenai karya dan kemampuan bermusik diri sendiri atau orang lain menggunakan istilah musik yang tepat."},{"id":"elem-musik-3","name":"Berpikir dan Bekerja Artistik (Thinking and Working Artistically)","description":"Mengeksplorasi variasi pola irama, tempo dan melodi dengan alat musik ritmis dan melodis menggunakan notasi musik dan teknik dasar yang telah dipelajari; menemukan alternatif untuk menghasilkan bunyi musik sederhana melalui eksplorasi material yang tersedia di lingkungan sekitar dan menerapkan cara memainkan dan merawat alat musik dengan teknik yang tepat sesuai dengan spesifikasi bahan alat musik."},{"id":"elem-musik-4","name":"Menciptakan (Creating)","description":"Membuat dan mengembangkan pola irama menggunakan anggota tubuh atau alat musik ritmis yang tersedia berdasarkan nilai kearifan lokal daerahnya."},{"id":"elem-musik-5","name":"Berdampak (Impacting)","description":"Menunjukkan minat dan rasa ingin tahu dalam kegiatan bermusik."}],"updatedAt":"2026-10-22T00:00:00.000Z"},{"id":"cp-rupa-fase-c","code":"CP-RUPA-C","fase":"C","targetGrades":[5,6],"subject":"Seni Rupa","title":"Capaian Pembelajaran Seni Rupa Fase C (Kelas V dan VI)","regulationReference":"Keputusan Kepala BSKAP Kemendikdasmen Nomor 046/H/KR/2025 Lampiran II","officialSource":"Salinan Kepka BSKAP 046/H/KR/2025, Lampiran II (Capaian Pembelajaran Seni Rupa)","verified":true,"seedRev":"046-H-KR-2025","generalDescription":"Pada akhir Fase C, murid memiliki kemampuan sebagai berikut.","elements":[{"id":"elem-rupa-1","name":"Mengalami (Experiencing)","description":"Menjelaskan unsur rupa dan prinsip desain dalam benda-benda di sekitar/karya seni rupa."},{"id":"elem-rupa-2","name":"Merefleksikan (Reflecting)","description":"Merefleksikan dan mengapresiasi karya diri sendiri dan teman sekelas menggunakan kosa kata seni rupa yang sesuai."},{"id":"elem-rupa-3","name":"Berpikir dan Bekerja Artistik (Thinking and Working Artistically)","description":"Mengenali dan menguji coba variasi teknik penggunaan alat dan/atau bahan."},{"id":"elem-rupa-4","name":"Menciptakan (Making/Creating)","description":"Membuat karya seni rupa berdasarkan pengalaman dan/atau hasil pengamatan terhadap lingkungan sekitar melalui pengembangan imajinasi."},{"id":"elem-rupa-5","name":"Berdampak (Impacting)","description":"Menghasilkan karya seni rupa yang mewakili minatnya."}],"updatedAt":"2026-10-22T00:00:00.000Z"},{"id":"cp-tari-fase-c","code":"CP-TARI-C","fase":"C","targetGrades":[5,6],"subject":"Seni Tari","title":"Capaian Pembelajaran Seni Tari Fase C (Kelas V dan VI)","regulationReference":"Keputusan Kepala BSKAP Kemendikdasmen Nomor 046/H/KR/2025 Lampiran II","officialSource":"Salinan Kepka BSKAP 046/H/KR/2025, Lampiran II (Capaian Pembelajaran Seni Tari)","verified":true,"seedRev":"046-H-KR-2025","generalDescription":"Pada akhir Fase C, murid memiliki kemampuan sebagai berikut.","elements":[{"id":"elem-tari-1","name":"Mengalami (Experiencing)","description":"Mengamati berbagai bentuk tari tradisi yang dapat digunakan untuk mengekspresikan diri melalui unsur pendukung tari."},{"id":"elem-tari-2","name":"Merefleksikan (Reflecting)","description":"Mengidentifikasi unsur pendukung tari dalam tari tradisi serta menghargai hasil pencapaian diri dengan mempertimbangkan pendapat orang lain."},{"id":"elem-tari-3","name":"Berpikir dan Bekerja Artistik (Thinking and Working Artistically)","description":"Meragakan hasil rangkaian gerak tari menggunakan unsur pendukung tari dengan menunjukan kerja sama dan berperan aktif dalam kelompok."},{"id":"elem-tari-4","name":"Menciptakan (Creating)","description":"Merangkai gerak tari yang berpijak pada tradisi/ kreasi dengan menerapkan desain kelompok."},{"id":"elem-tari-5","name":"Berdampak (Impacting)","description":"Menanggapi kejadian-kejadian di lingkungan sekitar melalui tari yang disajikan kepada penonton atau masyarakat sekitar."}],"updatedAt":"2026-10-22T00:00:00.000Z"},{"id":"cp-teater-fase-c","code":"CP-TEATER-C","fase":"C","targetGrades":[5,6],"subject":"Seni Teater","title":"Capaian Pembelajaran Seni Teater Fase C (Kelas V dan VI)","regulationReference":"Keputusan Kepala BSKAP Kemendikdasmen Nomor 046/H/KR/2025 Lampiran II","officialSource":"Salinan Kepka BSKAP 046/H/KR/2025, Lampiran II (Capaian Pembelajaran Seni Teater)","verified":true,"seedRev":"046-H-KR-2025","generalDescription":"Pada akhir Fase C, murid memiliki kemampuan sebagai berikut.","elements":[{"id":"elem-teater-1","name":"Mengalami (Experiencing)","description":"Melakukan permainan peran berkelompok, seperti improvisasi untuk melatih aksi dan reaksi dalam mengelaborasi cerita atau tokoh dan melakukan pengenalan karakter melalui pengamatan kebiasaan tokoh yang diperankan."},{"id":"elem-teater-2","name":"Merefleksikan (Reflection)","description":"Menceritakan pendapatnya tentang sebuah cerita sederhana (penokohan, perwatakan)."},{"id":"elem-teater-3","name":"Berpikir dan Bekerja Artistik (Thinking and Working Artistically)","description":"Mengidentifikasi properti sederhana berdasarkan cerita yang akan dimainkan."},{"id":"elem-teater-4","name":"Menciptakan (Creating)","description":"Mengenal dan memainkan ragam peran dari cerita sederhana berdasarkan hasil pengamatan."},{"id":"elem-teater-5","name":"Berdampak (Impacting)","description":"Memerankan lakon secara individu maupun berkelompok berdasarkan minat, pengamatan, dan pengalaman."}],"updatedAt":"2026-10-22T00:00:00.000Z"},{"id":"cp-ing-fase-c","code":"CP-ING-C","fase":"C","targetGrades":[5,6],"subject":"Bahasa Inggris","title":"Capaian Pembelajaran Bahasa Inggris Fase C (Kelas V dan VI)","regulationReference":"Keputusan Kepala BSKAP Kemendikdasmen Nomor 046/H/KR/2025 Lampiran II","officialSource":"Salinan Kepka BSKAP 046/H/KR/2025, Lampiran II (Capaian Pembelajaran Bahasa Inggris)","verified":true,"seedRev":"046-H-KR-2025","generalDescription":"Pada akhir Fase C, murid memiliki kemampuan sebagai berikut.","elements":[{"id":"elem-ing-1","name":"Menyimak - Berbicara (Listening - Writing)","description":"Memahami alur informasi teks secara keseluruhan dan merespon teks lisan atau teks multimodal sederhana tentang topik sehari-hari secara lisan dengan kalimat pendek dan sederhana sesuai konteks. (Understand the entire flow of information and respond to simple oral or multimodal texts about everyday topics using short and simple sentences verbally in line with its context)"},{"id":"elem-ing-2","name":"Membaca - Memirsa (Reading - Viewing)","description":"Memahami alur informasi secara keseluruhan, gagasan utama dan informasi rinci dari beragam teks pendek atau teks multimodal tentang topik sehari-hari dan meresponnya sesuai konteks. (Understand the entire flow of information, main ideas and details from a variety of short texts or multimodal texts about everyday topics and respond in line with its context)"},{"id":"elem-ing-3","name":"Menulis - Mempresentasikan (Writing - Presenting)","description":"Mengomunikasikan ide dan pengalamannya melalui berbagai jenis teks tulis sederhana atau teks multimodal tentang topik sehari-hari sesuai konteks. (Communicate their ideas and experiences through various types of simple written texts or multimodal texts about everyday topics in line with its context)"}],"updatedAt":"2026-10-22T00:00:00.000Z"},{"id":"cp-kka-fase-c","code":"CP-KKA-C","fase":"C","targetGrades":[5,6],"subject":"Koding dan Kecerdasan Artifisial","title":"Capaian Pembelajaran Koding dan Kecerdasan Artifisial Fase C (Kelas V dan VI)","regulationReference":"Panduan Mata Pelajaran Koding dan Kecerdasan Artifisial Fase C, D, E, dan F (BSKAP Kemendikdasmen, 2025)","officialSource":"Panduan Mata Pelajaran Koding dan Kecerdasan Artifisial, Bab B.2.d Capaian Pembelajaran Mata Pelajaran, Fase C (versi 12 September 2025, revisi 3)","verified":true,"seedRev":"kka-panduan-2025-09-12-r3","generalDescription":"Pada akhir Fase C, murid memiliki kemampuan sebagai berikut.","elements":[{"id":"elem-kka-1","name":"Berpikir Komputasional","description":"Memahami permasalahan sederhana dalam kehidupan sehari-hari, menerapkan pemecahan masalah secara sistematis, serta menuliskan instruksi logis dan terstruktur menggunakan sekumpulan kosakata atau simbol."},{"id":"elem-kka-2","name":"Literasi Digital","description":"Memahami konsep dasar, manfaat, dan dampak teknologi digital, memahami sistem komputer tingkat pradasar, menerapkan pengamanan informasi pribadi dalam komunikasi daring, memanfaatkan internet, dan memproduksi serta mendiseminasi konten digital dalam bentuk teks dan gambar."},{"id":"elem-kka-3","name":"Literasi dan Etika Kecerdasan Artifisial","description":"Memahami konsep KA sederhana, manfaat dan dampak KA pada kehidupan sehari-hari, prinsip bahwa KA dikembangkan untuk meningkatkan kesejahteraan manusia dan tidak boleh merugikan manusia, mengetahui perbedaan manusia dan komputer dalam melakukan penginderaan, dan mengetahui perbedaan antara mesin cerdas dan mesin non-cerdas. Memahami etika dasar penggunaan KA seperti empati dan tidak menyakiti orang lain."},{"id":"elem-kka-4","name":"Pemanfaatan dan Pengembangan Kecerdasan Artifisial","description":"Menyimulasikan secara sederhana kerja KA saat mengenali pola, mengklasifikasi benda konkret berdasarkan sifatnya, dan mengetahui bagaimana prediksi sistem KA dipengaruhi input benda konkret."}],"referenceAlur":{"5":["Menerapkan pemecahan masalah dalam kehidupan sehari-hari","Memahami konsep berpikir komputasional","Menuliskan urutan instruksi secara logis","Memahami konsep dasar teknologi digital","Memahami perangkat keras dan perangkat lunak komputer","Memahami keamanan informasi pribadi","Memahami Kecerdasan Artifisial","Memahami perbedaan komputer dan manusia dalam penginderaan","Memahami perbedaan mesin cerdas vs. mesin non-cerdas","Memahami manfaat Kecerdasan Artifisial dalam kehidupan sehari-hari","Menerapkan konsep klasifikasi dalam kehidupan sehari-hari","Memahami bagaimana Kecerdasan Artifisial melakukan klasifikasi","Menerapkan eksperimen klasifikasi manual vs. klasifikasi oleh Kecerdasan Artifisial","Memahami pengaruh data input terhadap hasil klasifikasi Kecerdasan Artifisial"],"6":["Menerapkan algoritma sederhana","Menerapkan representasi simbol dalam instruksi","Melakukan eksperimen dengan instruksi logis","Menerapkan internet secara aman dan produktif","Memahami dampak teknologi digital","Menerapkan produksi konten digital dalam bentuk teks dan gambar","Menerapkan diseminasi konten digital dalam bentuk teks dan gambar","Memahami cara kerja Kecerdasan Artifisial secara sederhana","Memahami etika dasar penggunaan Kecerdasan Artifisial","Memahami bagaimana Kecerdasan Artifisial melakukan klasifikasi","Memahami bagaimana Kecerdasan Artifisial belajar dari data","Memahami model klasifikasi sederhana","Memahami faktor yang memengaruhi prediksi Kecerdasan Artifisial","Melakukan eksperimen dengan data"]},"updatedAt":"2026-10-23T00:00:00.000Z"},{"id": "cp-mulok-madura-fase-a", "code": "CP-MADURA-A", "fase": "A", "targetGrades": [1, 2], "subject": "Muatan Lokal: Bahasa Madura", "title": "Capaian Pembelajaran Muatan Lokal: Bahasa Madura Fase A (Kelas I dan II)", "regulationReference": "Capaian Pembelajaran Fase A, B, C, D, E, dan F Mata Pelajaran Bahasa Daerah (Bahasa Jawa dan Madura) Provinsi Jawa Timur Tahun 2022 (Dinas Pendidikan Provinsi Jawa Timur, ditetapkan Surabaya, 15 Juli 2022; mengacu Kurikulum Merdeka, Kepmendikbudristek No. 262/M/2022)", "officialSource": "Dokumen CP-B Daerah Jatim 2022, Bab D (Capaian Pembelajaran Mata Pelajaran Bahasa Daerah Setiap Fase), bagian Bahasa Madura.", "verified": true, "seedRev": "mulok-madura-jatim-2022-r1", "generalDescription": "Pada akhir Fase A, murid memiliki kemampuan berbahasa Madura dalam melafalkan bunyi huruf, suku kata, dan kata tentang nama-nama anggota tubuh dan kata kerja dalam ragam onḍhâgghâ bhâsa. Murid memiliki kemampuan memahami dan memaknai bahasa Madura dari media audio dan teks aural (teks yang dibacakan dan/atau didengar) pada jenis dhungngèng, kèjhung èn-maènan, instruksi lisan, dan percakapan. Murid mampu berbicara sesuai dengan onḍhâgghâ bhâsa tentang beragam topik yang dikenali menggunakan volume dan intonasi yang tepat sesuai konteks. Murid mampu menunjukkan keterampilan menulis permulaan huruf latin dengan benar (cara memegang alat tulis, jarak mata dengan buku, menebalkan garis/huruf, dan sebagainya).", "elements": [{"id": "elem-madura-1", "name": "Menyimak", "description": "Murid mampu bersikap menjadi penyimak bunyi huruf, suku kata, dan kata tentang nama-nama anggota tubuh dan kata kerja dalam ragam onḍhâgghâ bhâsa. Murid mampu memahami pesan lisan dan informasi dari media audio, teks aural (teks yang dibacakan dan/atau didengar) pada jenis dhungngèng, kèjhung èn-maènan, instruksi lisan, dan percakapan yang berkaitan dengan tujuan berkomunikasi tentang diri sendiri dan lingkungan terdekat (keluarga, sekolah, dan masyarakat)."}, {"id": "elem-madura-2", "name": "Membaca dan Memirsa", "description": "Murid mampu bersikap menjadi pembaca dan pemirsa yang menunjukkan minat terhadap teks dhungngèng dan laghu èn-maènan yang dibaca atau dipirsa. Murid mampu membaca kata-kata yang dikenalinya sehari-hari dengan fasih. Murid mampu memahami informasi dari bacaan dan tayangan yang dibaca dan dipirsa tentang diri sendiri dan lingkungan terdekat (keluarga, sekolah, dan masyarakat) pada teks deskripsi imajinatif dan puisi anak sederhana. Murid mampu memaknai kosakata baru dari
