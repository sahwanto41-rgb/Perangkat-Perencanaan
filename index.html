teks yang dibaca atau tayangan yang dipirsa dengan bantuan ilustrasi."}, {"id": "elem-madura-3", "name": "Berbicara dan Mempresentasikan", "description": "Murid mampu berbicara dengan santun sesuai dengan onḍhâgghâ bhâsa tentang beragam topik yang dikenali menggunakan volume dan intonasi yang tepat sesuai konteks. Murid mampu merespons dengan bertanya tentang sesuatu, menjawab, dan menanggapi komentar orang lain (teman, guru, dan orang dewasa) dengan baik dan santun dalam suatu percakapan. Murid mampu mengungkapkan gagasan secara lisan dengan atau tanpa bantuan gambar/ilustrasi. Murid mampu menceritakan kembali isi informasi yang dibaca atau didengar dan menceritakan kembali teks narasi yang dibacakan atau dibaca dengan topik diri sendiri dan lingkungan terdekat (keluarga, sekolah, dan masyarakat). Murid mampu melagukan kèjhung èn-maènan."}, {"id": "elem-madura-4", "name": "Menulis", "description": "Murid mampu menunjukkan keterampilan menulis permulaan huruf latin (cara memegang alat tulis, jarak mata dengan buku, menebalkan garis/huruf, dan sebagainya) di atas kertas dan/atau melalui media digital dengan benar. Murid mengembangkan tulisan tangan yang semakin baik. Murid mampu menulis teks deskripsi dengan beberapa kalimat sederhana, menulis teks rekon tentang pengalaman diri, dan menulis kembali narasi berdasarkan teks fiksi yang dibaca atau didengar. Murid mampu menulis teks prosedur sederhana dan teks eksposisi sederhana tentang kehidupan sehari-hari."}], "updatedAt": "2026-10-28T00:00:00.000Z"},{"id": "cp-mulok-madura-fase-b", "code": "CP-MADURA-B", "fase": "B", "targetGrades": [3, 4], "subject": "Muatan Lokal: Bahasa Madura", "title": "Capaian Pembelajaran Muatan Lokal: Bahasa Madura Fase B (Kelas III dan IV)", "regulationReference": "Capaian Pembelajaran Fase A, B, C, D, E, dan F Mata Pelajaran Bahasa Daerah (Bahasa Jawa dan Madura) Provinsi Jawa Timur Tahun 2022 (Dinas Pendidikan Provinsi Jawa Timur, ditetapkan Surabaya, 15 Juli 2022; mengacu Kurikulum Merdeka, Kepmendikbudristek No. 262/M/2022)", "officialSource": "Dokumen CP-B Daerah Jatim 2022, Bab D (Capaian Pembelajaran Mata Pelajaran Bahasa Daerah Setiap Fase), bagian Bahasa Madura.", "verified": true, "seedRev": "mulok-madura-jatim-2022-r1", "generalDescription": "Pada akhir Fase B, murid mempunyai kemampuan berbahasa Madura untuk berkomunikasi dan bersikap sesuai dengan onḍhâgghâ bhâsa kepada teman sebaya dan orang yang lebih tua. Murid mampu memahami dan menyampaikan pesan atau makna yang terdapat dalam teks narasi dhungngèng anak, puisi anak, dan lalongèt. Murid mampu mengungkapkan gagasan secara mandiri maupun berkelompok/diskusi menggunakan bahasa Madura. Murid mampu memahami penggunaan carakan Madhurâ (aksara ghâjâng, sanḍhângan, pangangghuy), membaca dan menulis kalimat sederhana menggunakan carakan Madhurâ, serta fasih membaca teks berbahasa Madura. Murid mahir menulis tegak bersambung dengan benar. Murid mampu mempresentasikan dan menulis teks sederhana berjenis teks narasi, deskripsi, rekon, prosedur, ataupun eksposisi menggunakan bahasa Madura, serta meningkatkan kosakata melalui berbagai kegiatan berbahasa dan bersastra dengan topik yang beragam.", "elements": [{"id": "elem-madura-1", "name": "Menyimak", "description": "Murid mampu memahami ide pokok (gagasan) suatu pesan lisan, informasi dari media audio, teks aural (teks yang dibacakan dan/atau didengar), dan instruksi lisan yang berkaitan dengan tujuan berkomunikasi. Murid mampu memahami dan memaknai teks narasi (dhungngèng anak) yang dibacakan atau dari media audio. Murid mampu memahami carakan Madhurâ (aksara ghâjâng, sanḍhângan, pangangghuy) yang dibacakan atau dari media audiovisual. Murid mampu memahami dan memaknai lalongèt (parèbhâsan, èbhârât, saloka) dari teks yang dibaca atau didengar melalui media audio."}, {"id": "elem-madura-2", "name": "Membaca dan Memirsa", "description": "Murid mampu memahami pesan dan informasi tentang kehidupan sehari-hari, teks narasi (dhungngèng anak), dan puisi anak dalam bentuk cetak atau elektronik. Murid mampu membaca kata-kata baru dengan pola kombinasi huruf yang telah dikenalinya dengan fasih. Murid mampu memahami ide pokok dan ide pendukung pada teks informatif. Murid mampu menjelaskan hal-hal yang dihadapi oleh tokoh cerita pada teks narasi (dhungngèng anak). Murid mampu memaknai kosakata baru dari teks yang dibaca atau tayangan yang dipirsa sesuai dengan topik. Murid mampu membaca kata dalam carakan Madhurâ (aksara ghâjâng, sanḍhângan, pangangghuy). Murid mampu memahami dan memaknai lalongèt (parèbhâsan, èbhârât, saloka) dari teks yang dibaca."}, {"id": "elem-madura-3", "name": "Berbicara dan Mempresentasikan", "description": "Murid mampu berbicara dengan pilihan kata dan sikap tubuh/gestur yang santun, menggunakan volume dan intonasi yang tepat sesuai onḍhâgghâ bhâsa. Murid mengajukan dan menanggapi pertanyaan, jawaban, pernyataan, dan penjelasan dalam suatu percakapan dan diskusi dengan aktif. Murid mampu mengungkapkan gagasan dalam suatu percakapan dan diskusi dengan mematuhi tata caranya. Murid mampu menceritakan kembali suatu informasi yang dibaca atau didengar dari teks narasi dengan topik yang beraneka ragam. Murid mampu melagukan kèjhung èn-maènan."}, {"id": "elem-madura-4", "name": "Menulis", "description": "Murid mampu menulis teks narasi (dhungngèng anak), teks deskripsi, teks rekon (diri sendiri), teks prosedur, dan teks eksposisi dengan rangkaian kalimat yang beragam, informasi yang rinci dan akurat, dengan topik yang beragam. Murid terampil menulis tegak bersambung. Murid mampu menulis kata dan kalimat sederhana dalam carakan Madhurâ (aksara ghâjâng, sanḍhângan, pangangghuy)."}], "updatedAt": "2026-10-28T00:00:00.000Z"},{"id": "cp-mulok-madura-fase-c", "code": "CP-MADURA-C", "fase": "C", "targetGrades": [5, 6], "subject": "Muatan Lokal: Bahasa Madura", "title": "Capaian Pembelajaran Muatan Lokal: Bahasa Madura Fase C (Kelas V dan VI)", "regulationReference": "Capaian Pembelajaran Fase A, B, C, D, E, dan F Mata Pelajaran Bahasa Daerah (Bahasa Jawa dan Madura) Provinsi Jawa Timur Tahun 2022 (Dinas Pendidikan Provinsi Jawa Timur, ditetapkan Surabaya, 15 Juli 2022; mengacu Kurikulum Merdeka, Kepmendikbudristek No. 262/M/2022)", "officialSource": "Dokumen CP-B Daerah Jatim 2022, Bab D (Capaian Pembelajaran Mata Pelajaran Bahasa Daerah Setiap Fase), bagian Bahasa Madura.", "verified": true, "seedRev": "mulok-madura-jatim-2022-r1", "generalDescription": "Pada akhir Fase C, murid memiliki kemampuan berbahasa Madura dalam memahami, mengolah, dan menginterpretasi berbagai jenis teks informatif dan fiksi. Murid menganalisis lalongèt (parèbhâsan, èbhârât, saloka) dalam teks yang dibacakan atau didengar. Murid mampu membaca carakan Madhurâ (aksara ghâjâng, sanḍhângan, pangangghuy) sesuai kaidah. Murid mampu menyampaikan informasi secara lisan menggunakan bahasa Madura sesuai kaidah dan konteks, dengan kosakata baru yang memiliki makna denotatif, konotatif, dan kiasan, pilihan kata yang tepat sesuai dengan norma budaya, serta fasih dan santun (menggunakan èngghi bhunten). Murid mampu menggunakan kaidah kebahasaan dan kesastraan untuk menulis teks prosa, puisi, dan teks lain secara kreatif sesuai dengan konteks dan norma budaya, serta menuliskan carakan Madhurâ sesuai dengan kaidah.", "elements": [{"id": "elem-madura-1", "name": "Menyimak", "description": "Murid mampu menganalisis informasi berupa fakta dan prosedur dengan mengidentifikasi ciri objek, urutan proses kejadian, dan nilai-nilai dari berbagai jenis teks informatif dan fiksi (cerita rakyat sederhana yang berkembang di daerah) yang disajikan dalam bentuk lisan, teks aural (teks yang dibacakan dan/atau didengar), dan audio. Murid menganalisis lalongèt (parèbhâsan, èbhârât, saloka) dalam teks yang dibacakan atau didengar."}, {"id": "elem-madura-2", "name": "Membaca dan Memirsa", "description": "Murid mampu membaca kata-kata dengan berbagai pola kombinasi huruf dengan fasih dan indah serta memahami informasi dan kosakata baru yang memiliki makna denotatif, literal, konotatif, dan kiasan, meliputi lalongèt (parèbhâsan, èbhârât, saloka), untuk mengidentifikasi objek, fenomena, dan karakter. Murid mampu mengidentifikasi ide pokok dari teks deskripsi, narasi (cerita rakyat sederhana daerah setempat), dan eksposisi, serta nilai-nilai yang terkandung di dalamnya. Murid mampu membaca carakan Madhurâ (aksara ghâjâng, sanḍhângan, pangangghuy)."}, {"id": "elem-madura-3", "name": "Berbicara dan Mempresentasikan", "description": "Murid mampu menyampaikan informasi secara lisan untuk tujuan menghibur dan meyakinkan mitra tutur sesuai kaidah dan konteks, menggunakan kosakata baru yang memiliki makna denotatif, konotatif, dan kiasan, pilihan kata yang tepat sesuai dengan norma budaya, serta menyampaikan informasi dengan fasih dan santun (menggunakan èngghi bhunten). Murid menyampaikan perasaan berdasarkan fakta dan imajinasi (dari diri sendiri dan orang lain) secara indah dan menarik dalam bentuk prosa dan puisi dengan penggunaan kosakata secara kreatif. Murid mempresentasikan gagasan, hasil pengamatan, dan pengalaman dengan logis, sistematis, efektif, kreatif, dan kritis, serta mempresentasikan imajinasi secara kreatif. Murid mampu melagukan tembhâng Madhurâ."}, {"id": "elem-madura-4", "name": "Menulis", "description": "Murid mampu menggunakan kaidah kebahasaan dan kesastraan untuk menulis teks sesuai dengan konteks dan norma budaya, serta menggunakan kosakata baru yang memiliki makna denotatif, konotatif, dan kiasan. Murid menyampaikan perasaan berdasarkan fakta dan imajinasi (dari diri sendiri dan orang lain) secara indah dan menarik dalam bentuk prosa dan puisi dengan penggunaan kosakata secara kreatif. Murid menuliskan carakan Madhurâ (aksara ghâjâng, sanḍhângan, pangangghuy)."}], "updatedAt": "2026-10-28T00:00:00.000Z"},{"id": "cp-mulok-btq-fase-a", "code": "CP-BTQ-A", "fase": "A", "targetGrades": [1, 2], "subject": "Muatan Lokal: Baca Tulis Qur’an (BTQ)", "title": "Capaian Pembelajaran Muatan Lokal: Baca Tulis Qur’an (BTQ) Fase A (Kelas I dan II)", "regulationReference": "Struktur Kurikulum SD/MI (Permendikdasmen No. 13 Tahun 2025): Muatan Lokal ditetapkan oleh satuan pendidikan", "officialSource": "Ditetapkan oleh UPTD SPF SD Negeri Lanas 1 sebagai muatan lokal (bukan CP nasional). Capaian per fase dirujuk dari CP PAI dan Budi Pekerti elemen Al-Qur’an Hadis, Mushaf Al-Qur’an Standar Indonesia (Kemenag RI), Tuhfatul Athfal, Hidayatus Shibyan, dan Al-Muqaddimah al-Jazariyyah; rasm Usmani merujuk Al-Muqni’ dan ʻAqilah (rujukan guru). Rincian per kelas disusun sekolah.", "verified": true, "seedRev": "mulok-2026-r5", "generalDescription": "Pada akhir Fase A, murid mengenal huruf hijaiah dan harakat dasar, mulai membaca dan menulis dengan bimbingan, serta membaca, menghafal, dan mengetahui arti sederhana surah Al-Fātiḥah dan surah-surah pendek Juz ʻAmma (An-Nās, Al-Falaq, Al-Ikhlāṣ, Al-Lahab, An-Naṣr, Al-Kāfirūn, dan Al-Kautsar) dengan bacaan yang benar.\n\nKelas I: Pada akhir Kelas I, murid mengenal dan melafalkan 28 huruf hijaiah sesuai makharijul huruf, membaca huruf berharakat fatḥah, kasrah, dan ḍammah serta huruf bersambung sederhana, dan menulis huruf hijaiah tunggal dengan bentuk yang benar. Murid membaca, menyalin dengan bimbingan, menghafal, dan mengetahui arti sederhana surah Al-Fātiḥah, An-Nās, Al-Falaq, dan Al-Ikhlāṣ, serta membiasakan adab membaca Al-Qur’an.\n\nKelas II: Pada akhir Kelas II, murid membaca kata dan kalimat pendek berharakat dengan lancar, termasuk tanwin, sukun, tasydid, dan mad ṭabiʻi, serta menyambung huruf menjadi kata sederhana berharakat. Murid membaca, menyalin dengan bimbingan, menghafal, dan mengetahui arti serta pesan sederhana surah Al-Lahab, An-Naṣr, Al-Kāfirūn, dan Al-Kautsar, serta menjaga kebersihan dan kemuliaan mushaf.", "elements": [{"id": "elem-btq-1", "name": "Membaca (Tilawah)", "description": "Mengenal dan melafalkan 28 huruf hijaiah sesuai makharijul huruf; membaca huruf bersambung berharakat fatḥah, kasrah, ḍammah, dan tanwin; membaca kata dan kalimat pendek berharakat, serta mengenal bacaan panjang (mad ṭabiʻi), sukun, dan tasydid secara sederhana.\n\nRincian per kelas:\nKelas I: Mengenal dan melafalkan 28 huruf hijaiah sesuai makharijul huruf. Membaca huruf berharakat fatḥah, kasrah, ḍammah dan huruf bersambung sederhana melalui jilid awal metode yang dipakai sekolah. Membaca dengan benar surah Al-Fātiḥah, An-Nās, Al-Falaq, dan Al-Ikhlāṣ.\nKelas II: Membaca kata dan kalimat pendek berharakat dengan lancar. Membaca tanwin, sukun, tasydid, dan mad ṭabiʻi (alif, ya, wau) dengan benar. Membaca dengan lancar surah Al-Lahab, An-Naṣr, Al-Kāfirūn, dan Al-Kautsar."}, {"id": "elem-btq-2", "name": "Menulis (Kitabah)", "description": "Menulis huruf hijaiah tunggal dengan bentuk yang benar; menyambung huruf menjadi kata sederhana berharakat; menyalin kata atau ayat pendek dengan bimbingan guru.\n\nRincian per kelas:\nKelas I: Menulis huruf hijaiah tunggal dengan bentuk yang benar. Mengenal bentuk huruf di awal, tengah, dan akhir kata. Menyalin ayat-ayat pendek surah Al-Fātiḥah, An-Nās, Al-Falaq, dan Al-Ikhlāṣ dengan bimbingan guru.\nKelas II: Menyambung huruf menjadi kata sederhana berharakat. Menyalin kata atau ayat pendek dengan bimbingan guru. Menyalin surah Al-Lahab, An-Naṣr, Al-Kāfirūn, dan Al-Kautsar dengan bimbingan guru."}, {"id": "elem-btq-3", "name": "Menghafal (Tahfidz)", "description": "Menghafal Al-Fātiḥah dan surah-surah pendek awal Juz ʻAmma (An-Nās, Al-Falaq, Al-Ikhlāṣ, Al-Lahab, An-Naṣr, Al-Kāfirūn, Al-Kautsar) dengan lancar dan makhraj yang benar; menghafal doa harian pendek.\n\nRincian per kelas:\nKelas I: Menghafal Al-Fātiḥah, An-Nās, Al-Falaq, dan Al-Ikhlāṣ serta doa harian pendek.\nKelas II: Menghafal Al-Lahab, An-Naṣr, Al-Kāfirūn, dan Al-Kautsar serta doa harian lanjutan."}, {"id": "elem-btq-4", "name": "Memahami (Fahmil Qur’an)", "description": "Mengenal Al-Qur’an sebagai kitab suci umat Islam yang wajib dihormati; mengetahui arti sederhana surah yang dihafal; membiasakan adab membaca Al-Qur’an (bersuci, membaca taʻawuz dan basmalah).\n\nRincian per kelas:\nKelas I: Mengenal Al-Qur’an sebagai kitab suci yang wajib dihormati. Membiasakan adab membaca (bersuci, taʻawuz, basmalah). Mengetahui arti sederhana surah yang dihafal. Mengetahui arti sederhana surah Al-Fātiḥah, An-Nās, Al-Falaq, dan Al-Ikhlāṣ.\nKelas II: Mengetahui arti surah yang dihafal dan pesan sederhananya (tauhid, ikhlas, memohon perlindungan Allah). Menjaga kebersihan dan kemuliaan mushaf. Mengetahui arti dan pesan sederhana surah Al-Lahab, An-Naṣr, Al-Kāfirūn, dan Al-Kautsar."}], "updatedAt": "2026-10-28T00:00:00.000Z"}, {"id": "cp-mulok-btq-fase-b", "code": "CP-BTQ-B", "fase": "B", "targetGrades": [3, 4], "subject": "Muatan Lokal: Baca Tulis Qur’an (BTQ)", "title": "Capaian Pembelajaran Muatan Lokal: Baca Tulis Qur’an (BTQ) Fase B (Kelas III dan IV)", "regulationReference": "Struktur Kurikulum SD/MI (Permendikdasmen No. 13 Tahun 2025): Muatan Lokal ditetapkan oleh satuan pendidikan", "officialSource": "Ditetapkan oleh UPTD SPF SD Negeri Lanas 1 sebagai muatan lokal (bukan CP nasional). Capaian per fase dirujuk dari CP PAI dan Budi Pekerti elemen Al-Qur’an Hadis, Mushaf Al-Qur’an Standar Indonesia (Kemenag RI), Tuhfatul Athfal, Hidayatus Shibyan, dan Al-Muqaddimah al-Jazariyyah; rasm Usmani merujuk Al-Muqni’ dan ʻAqilah (rujukan guru). Rincian per kelas disusun sekolah.", "verified": true, "seedRev": "mulok-2026-r5", "generalDescription": "Pada akhir Fase B, murid membaca Al-Qur’an dengan lancar dan tartil, menerapkan hukum tajwid dasar, dan menulis ayat pendek dengan benar, serta membaca, menulis, menghafal, dan memahami arti serta pesan pokok surah Al-Māʻūn, Quraisy, Al-Fīl, Al-Humazah, Al-ʻAṣr, At-Takātsur, dan Al-Qāriʻah.\n\nKelas III: Pada akhir Kelas III, murid membaca jilid lanjutan atau Juz ʻAmma dengan lancar, menerapkan hukum nun sukun/tanwin, mim sukun, dan lam taʻrīf, serta menulis kalimat dan ayat pendek lengkap dengan harakat dan tanda baca, termasuk yang didiktekan. Murid membaca, menulis, menghafal, dan memahami arti serta pesan pokok surah Al-Māʻūn, Quraisy, Al-Fīl, dan Al-Humazah, serta mengaitkannya dengan perilaku sehari-hari.\n\nKelas IV: Pada akhir Kelas IV, murid membaca mushaf Juz ʻAmma dengan tartil, menerapkan mad farʻi, ghunnah, qalqalah, serta waqaf dan ibtida’ dasar, dan menulis ayat dari hafalan dengan menandai tajwid sederhana sesuai rasm Mushaf Standar Indonesia. Murid membaca, menulis, menghafal, dan memahami arti serta pesan pokok surah Al-ʻAṣr, At-Takātsur, dan Al-Qāriʻah, serta mengetahui adab dan keutamaan membaca Al-Qur’an.", "elements": [{"id": "elem-btq-1", "name": "Membaca (Tilawah)", "description": "Membaca Al-Qur’an (jilid/tingkat lanjutan) dengan lancar dan tartil; menerapkan hukum nun sukun/tanwin (iẓhār, idgām, iqlāb, ikhfā’), mim sukun, mad (ṭabiʻi, wājib muttaṣil, dan jā’iz munfaṣil), serta lam taʻrīf (qamariyah dan syamsiyah); mengenal waqaf dan ibtida’ dasar.\n\nRincian per kelas:\nKelas III: Membaca jilid lanjutan atau Juz ʻAmma dengan lancar. Menerapkan hukum nun sukun/tanwin (iẓhār, idgām, iqlāb, ikhfā’), mim sukun, dan lam taʻrīf (qamariyah dan syamsiyah). Membaca dengan lancar surah Al-Māʻūn, Quraisy, Al-Fīl, dan Al-Humazah.\nKelas IV: Membaca mushaf Juz ʻAmma dengan tartil. Menerapkan mad farʻi (wājib muttaṣil dan jā’iz munfaṣil), ghunnah, qalqalah, serta waqaf dan ibtida’ dasar. Membaca dengan tartil surah Al-ʻAṣr, At-Takātsur, dan Al-Qāriʻah."}, {"id": "elem-btq-2", "name": "Menulis (Kitabah)", "description": "Menulis kalimat dan ayat pendek lengkap dengan harakat, tanda baca, dan tanda tajwid sederhana; menulis dengan rapi sesuai kaidah rasm; menulis ayat yang didiktekan.\n\nRincian per kelas:\nKelas III: Menulis kalimat dan ayat pendek lengkap dengan harakat dan tanda baca. Menulis ayat pendek yang didiktekan (imlā’). Menulis ayat dari surah Al-Māʻūn, Quraisy, Al-Fīl, dan Al-Humazah yang didiktekan.\nKelas IV: Menulis ayat dari hafalan. Menandai tajwid sederhana pada tulisan. Mengikuti rasm Mushaf Al-Qur’an Standar Indonesia. Menulis surah Al-ʻAṣr, At-Takātsur, dan Al-Qāriʻah dari hafalan."}, {"id": "elem-btq-3", "name": "Menghafal (Tahfidz)", "description": "Menghafal surah-surah Juz ʻAmma lanjutan (Al-Māʻūn, Quraisy, Al-Fīl, Al-Humazah, Al-ʻAṣr, At-Takātsur, Al-Qāriʻah) dengan lancar dan fasih; menghafal ayat pilihan dan doa-doa pilihan; melakukan murajaah (pengulangan) secara rutin.\n\nRincian per kelas:\nKelas III: Menghafal Al-Māʻūn, Quraisy, Al-Fīl, dan Al-Humazah serta doa pilihan. Murajaah rutin surah kelas I dan II.\nKelas IV: Menghafal Al-ʻAṣr, At-Takātsur, dan Al-Qāriʻah serta ayat pilihan. Murajaah surah kelas I sampai III."}, {"id": "elem-btq-4", "name": "Memahami (Fahmil Qur’an)", "description": "Memahami arti dan pesan pokok surah yang dihafal; mengaitkan isi surah dengan perilaku sehari-hari (jujur, peduli, syukur, tidak sombong); mengetahui adab dan keutamaan membaca Al-Qur’an.\n\nRincian per kelas:\nKelas III: Memahami arti dan pesan pokok surah yang dihafal (peduli anak yatim, bersyukur). Mengaitkan isi surah dengan perilaku sehari-hari. Memahami arti dan pesan pokok surah Al-Māʻūn, Quraisy, Al-Fīl, dan Al-Humazah.\nKelas IV: Memahami pesan pokok surah (menghargai waktu, tidak sombong dengan harta, kehidupan akhirat). Mengetahui adab dan keutamaan membaca Al-Qur’an. Memahami arti dan pesan pokok surah Al-ʻAṣr, At-Takātsur, dan Al-Qāriʻah."}], "updatedAt": "2026-10-28T00:00:00.000Z"}, {"id": "cp-mulok-btq-fase-c", "code": "CP-BTQ-C", "fase": "C", "targetGrades": [5, 6], "subject": "Muatan Lokal: Baca Tulis Qur’an (BTQ)", "title": "Capaian Pembelajaran Muatan Lokal: Baca Tulis Qur’an (BTQ) Fase C (Kelas V dan VI)", "regulationReference": "Struktur Kurikulum SD/MI (Permendikdasmen No. 13 Tahun 2025): Muatan Lokal ditetapkan oleh satuan pendidikan", "officialSource": "Ditetapkan oleh UPTD SPF SD Negeri Lanas 1 sebagai muatan lokal (bukan CP nasional). Capaian per fase dirujuk dari CP PAI dan Budi Pekerti elemen Al-Qur’an Hadis, Mushaf Al-Qur’an Standar Indonesia (Kemenag RI), Tuhfatul Athfal, Hidayatus Shibyan, dan Al-Muqaddimah al-Jazariyyah; rasm Usmani merujuk Al-Muqni’ dan ʻAqilah (rujukan guru). Rincian per kelas disusun sekolah.", "verified": true, "seedRev": "mulok-2026-r5", "generalDescription": "Pada akhir Fase C, murid membaca Al-Qur’an secara tartil dan fasih sesuai tajwid dan menulis ayat sesuai kaidah rasm, serta membaca, menulis, menghafal secara konsisten, memahami, dan mengamalkan kandungan surah Al-ʻĀdiyāt, Az-Zalzalah, Al-Qadr, At-Tīn, Al-Bayyinah, Al-ʻAlaq, Asy-Syarḥ, Ad-Ḍuḥā, dan Ayat Kursi.\n\nKelas V: Pada akhir Kelas V, murid membaca mushaf dengan tartil, menerapkan ra’ tafkhīm/tarqīq, lafzhul jalalah, idgām mutamātsilain/mutajānisain/mutaqāribain, dan mad lāzim, serta menulis ayat pilihan sesuai rasm dengan menandai hukum tajwid. Murid membaca, menulis, menghafal secara konsisten, dan memahami arti per ayat serta kandungan surah Al-ʻĀdiyāt, Az-Zalzalah, Al-Qadr, dan At-Tīn.\n\nKelas VI: Pada akhir Kelas VI, murid membaca mushaf dengan tartil dan fasih, menerapkan hukum waqaf-ibtida’ dan mad farʻi secara lengkap, mengenali dan memperbaiki lahn jalī dan khafī, serta menulis ayat dari hafalan dan dikte dengan rapi (khat sederhana). Murid membaca, menulis, menghafal, dan menjelaskan arti per ayat serta pesan akhlak surah Al-Bayyinah, Al-ʻAlaq, Asy-Syarḥ, Ad-Ḍuḥā, dan Ayat Kursi, serta menerapkannya dalam disiplin ibadah dan sikap sehari-hari.", "elements": [{"id": "elem-btq-1", "name": "Membaca (Tilawah)", "description": "Membaca Al-Qur’an (mushaf) dengan tartil, fasih, dan lancar; menerapkan hukum tajwid secara lebih lengkap: nun sukun/tanwin, mim sukun, mad farʻi, qalqalah, ra’ tafkhīm/tarqīq, lafzhul jalalah, dan hukum waqaf-ibtida’; mengenali dan memperbaiki kesalahan bacaan (lahn jalī dan khafī) secara mandiri atau dengan teman sebaya.\n\nRincian per kelas:\nKelas V: Membaca mushaf dengan tartil. Menerapkan ra’ tafkhīm/tarqīq, lafzhul jalalah, idgām mutamātsilain/mutajānisain/mutaqāribain, dan mad lāzim. Membaca dengan tartil surah Al-ʻĀdiyāt, Az-Zalzalah, Al-Qadr, dan At-Tīn.\nKelas VI: Membaca mushaf dengan tartil dan fasih. Menerapkan hukum waqaf-ibtida’ dan mad farʻi secara lengkap. Mengenali dan memperbaiki lahn jalī dan khafī secara mandiri atau dengan teman sebaya. Membaca dengan tartil dan fasih surah Al-Bayyinah, Al-ʻAlaq, Asy-Syarḥ, Ad-Ḍuḥā, dan Ayat Kursi."}, {"id": "elem-btq-2", "name": "Menulis (Kitabah)", "description": "Menulis ayat Al-Qur’an dengan benar dan indah (khat sederhana) sesuai rasm Usmani; menulis ayat dari hafalan atau dikte; menandai hukum tajwid pada tulisan.\n\nRincian per kelas:\nKelas V: Menulis ayat pilihan dengan benar sesuai rasm Mushaf Standar Indonesia. Menandai hukum tajwid yang ditemukan. Menulis ayat pilihan surah Al-ʻĀdiyāt, Az-Zalzalah, Al-Qadr, dan At-Tīn sesuai rasm.\nKelas VI: Menulis ayat dari hafalan dan dikte dengan rapi (khat sederhana). Menandai hukum tajwid pada tulisan. Menulis surah Al-Bayyinah, Al-ʻAlaq, Asy-Syarḥ, Ad-Ḍuḥā, dan Ayat Kursi dari hafalan atau dikte."}, {"id": "elem-btq-3", "name": "Menghafal (Tahfidz)", "description": "Menghafal surah-surah Juz ʻAmma lainnya (Al-ʻĀdiyāt, Az-Zalzalah, Al-Bayyinah, Al-Qadr, Al-ʻAlaq, At-Tīn, Asy-Syarḥ, Ad-Ḍuḥā) secara lancar dan fasih; melakukan setoran dan murajaah konsisten; menghafal ayat pilihan seperti Ayat Kursi.\n\nRincian per kelas:\nKelas V: Menghafal Al-ʻĀdiyāt, Az-Zalzalah, Al-Qadr, dan At-Tīn. Setoran dan murajaah konsisten.\nKelas VI: Menghafal Al-Bayyinah, Al-ʻAlaq, Asy-Syarḥ, Ad-Ḍuḥā, dan Ayat Kursi. Murajaah Juz ʻAmma yang sudah dihafal."}, {"id": "elem-btq-4", "name": "Memahami (Fahmil Qur’an)", "description": "Memahami arti per ayat dan kandungan pokok surah yang dihafal; menjelaskan pesan akhlak dan hukum dasar yang terkandung; menerapkan nilai Al-Qur’an dalam sikap sehari-hari (disiplin ibadah, jujur, sabar, tolong-menolong, cinta ilmu).\n\nRincian per kelas:\nKelas V: Memahami arti per ayat dan kandungan pokok surah (amal sekecil apa pun diperhitungkan, manusia diciptakan sebaik-baiknya, keutamaan malam Lailatul Qadar). Memahami arti per ayat dan kandungan surah Al-ʻĀdiyāt, Az-Zalzalah, Al-Qadr, dan At-Tīn.\nKelas VI: Menjelaskan pesan akhlak dan hukum dasar yang terkandung (semangat menuntut ilmu, sabar dan syukur, tauhid). Menerapkan dalam disiplin ibadah dan sikap sehari-hari. Menjelaskan arti per ayat dan pesan akhlak surah Al-Bayyinah, Al-ʻAlaq, Asy-Syarḥ, Ad-Ḍuḥā, dan Ayat Kursi."}], "updatedAt": "2026-10-28T00:00:00.000Z"}],ee={id:`rme-bindo-k4-2026-2027`,academicYearId:`ay-2026-2027`,semester:`ganjil`,grade:4,fase:`B`,subject:`Bahasa Indonesia`,jpPerWeek:6,months:[{monthIndex:0,monthName:`Juli 2026`,year:2026,totalCalendarWeeks:5,nonEffectiveWeeks:2,effectiveWeeks:3,nonEffectiveReasons:[`Libur Akhir Tahun Pelajaran (W1)`,`MPLS dan Transisi Belajar (W2)`],effectiveDaysCount:14,notes:`Minggu ke-3, 4, dan 5 merupakan minggu pembelajaran efektif reguler.`},{monthIndex:1,monthName:`Agustus 2026`,year:2026,totalCalendarWeeks:4,nonEffectiveWeeks:0,effectiveWeeks:4,nonEffectiveReasons:[],effectiveDaysCount:20,notes:`Peringatan HUT RI ke-81 dilaksanakan 1 hari, tidak membatalkan minggu efektif.`},{monthIndex:2,monthName:`September 2026`,year:2026,totalCalendarWeeks:4,nonEffectiveWeeks:1,effectiveWeeks:3,nonEffectiveReasons:[`Asesmen Sumatif Tengah Semester (ASTS) W4`],effectiveDaysCount:16,notes:`1 minggu dialokasikan untuk pelaksanaan ASTS Ganjil.`},{monthIndex:3,monthName:`Oktober 2026`,year:2026,totalCalendarWeeks:5,nonEffectiveWeeks:0,effectiveWeeks:5,nonEffectiveReasons:[],effectiveDaysCount:22,notes:`Bulan efektif penuh dengan 5 minggu belajar aktif.`},{monthIndex:4,monthName:`November 2026`,year:2026,totalCalendarWeeks:4,nonEffectiveWeeks:0,effectiveWeeks:4,nonEffectiveReasons:[],effectiveDaysCount:20,notes:`Pembelajaran materi reguler bab terakhir semester ganjil.`},{monthIndex:5,monthName:`Desember 2026`,year:2026,totalCal     <style id="sipena-responsive">
/* ===== SIPENA: penyelarasan tampilan laptop <-> HP/Android ===== */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{overflow-x:hidden}
.sp-menu-btn,.sp-backdrop{display:none}

/* Laptop/desktop: sidebar menempel di layar, tidak ikut tergulir bersama halaman */
@media screen and (min-width:1024px){
  #root .min-h-screen.flex > aside{
    position:sticky;top:0;align-self:flex-start;
    height:100vh;height:100dvh;overflow-y:auto;overscroll-behavior:contain;
  }
}

@media screen and (max-width:1023px){
  /* tinggi layar penuh yang akurat di browser HP (bar alamat naik-turun) */
  #root .min-h-screen{min-height:100vh;min-height:100dvh}

  /* Sidebar -> laci geser (drawer) */
  #root .min-h-screen.flex > aside{
    position:fixed;top:0;bottom:0;left:0;height:100vh;height:100dvh;
    width:min(84vw,300px)!important;z-index:60;
    transform:translateX(-102%);visibility:hidden;
    transition:transform .28s cubic-bezier(.2,.8,.2,1),visibility 0s linear .28s;
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  body.sp-nav-open #root .min-h-screen.flex > aside{
    transform:none;visibility:visible;transition-delay:0s;
    box-shadow:14px 0 40px rgba(0,0,0,.45);
  }
  #root aside > div:first-child > button{display:none}      /* tombol ciutkan tidak dipakai di HP */
  #root aside button{min-height:44px}
  .sp-backdrop{display:block;position:fixed;inset:0;z-index:55;background:rgba(15,23,42,.55);
    -webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);opacity:0;pointer-events:none;transition:opacity .25s}
  body.sp-nav-open .sp-backdrop{opacity:1;pointer-events:auto}
  body.sp-nav-open{overflow:hidden}

  /* Tombol hamburger */
  body.sp-has-nav .sp-menu-btn{display:grid;place-items:center;position:fixed;z-index:25;
    top:calc(env(safe-area-inset-top,0px) + 12px);left:12px;width:40px;height:40px;border-radius:11px;
    border:1px solid #e2e8f0;background:#fff;color:#0f766e;cursor:pointer;
    box-shadow:0 2px 0 #cbd5e1,0 6px 12px -6px rgba(15,23,42,.25);-webkit-tap-highlight-color:transparent}
  .sp-menu-btn:active{transform:translateY(2px);box-shadow:none}

  /* Header */
  #root header.sticky{padding-left:62px;padding-right:12px;gap:8px}
  #root header.sticky > div:first-child{min-width:0;flex:1 1 auto}
  #root header.sticky > div:first-child > div{min-width:0}
  #root header.sticky > div:last-child{flex-shrink:0;gap:8px}
}

@media screen and (max-width:767px){
  /* Header ringkas: hanya nama modul */
  #root header.sticky .sipena-3d,
  #root header.sticky .sipena-3d + span{display:none}
  #root header.sticky .text-teal-700{display:block;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;font-weight:700}
  #root header.sticky .pl-3{padding-left:8px}
  .sipena-logout{padding:8px 9px}
  .sipena-logout span:last-child{display:none}

  /* Tabel lebar bisa digeser ke samping, tidak memotong halaman */
  #root div:has(> table){overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:100%}
  #root table{min-width:560px}

  /* Dokumen pratinjau cetak (kertas A4) */
  #root [class*="210mm"]{padding:16px!important;overflow-x:auto;max-width:100%}

  /* Modal tidak melebihi layar */
  #root .fixed.inset-0{padding:12px!important;align-items:center}
  #root .fixed.inset-0 > div{max-height:calc(100vh - 24px);max-height:calc(100dvh - 24px);overflow-y:auto;max-width:100%}

  /* Cegah zoom otomatis saat mengetik (iOS/Android) */
  #root input:not([type=checkbox]):not([type=radio]):not([type=range]),#root select,#root textarea{font-size:16px}

  /* Teks panjang tidak membuat layar melebar */
  main{overflow-wrap:anywhere}
  main h1,main h2{overflow-wrap:break-word}
}

@media screen and (max-width:479px){
  /* Tombol CERDAS AI jadi ikon saja agar judul modul tetap terbaca */
  #root header.sticky button.bg-gradient-to-r{padding:8px 10px}
  #root header.sticky button.bg-gradient-to-r span{display:none}
}

    <script>
    (function(){

      // Permendikdasmen No. 13 Tahun 2025 (perubahan atas Permendikbudristek No. 12 Tahun 2024). 1 JP = 35 menit.

      var PAI=["Pendidikan Agama dan Budi Pekerti",3,1],PANC=["Pendidikan Pancasila",4,1],PJOK=["PJOK",3,1],SENI=["Seni dan Budaya (satu jenis seni)",3,1];

      function MAT(n){return["Matematika",n,1]}
      var IPAS=["IPAS",5,1],ING=["Bahasa Inggris (mulai kelas III)",2,0];
      // Muatan Lokal maksimal 2 JP/minggu; dibagi 1 JP Bahasa Madura + 1 JP BTQ (kebijakan sekolah, dapat diubah di sini).
      var MULOK=[["Muatan Lokal: Bahasa Madura",1,0],["Muatan Lokal: Baca Tulis Qur’an (BTQ)",1,0]];
      var KKA=["Koding dan Kecerdasan Artifisial (pilihan, mulai kelas V)",2,0];
      var UPPER=[PAI,PANC,BI(6),MAT(5),IPAS,PJOK,SENI,ING];
      var G={

        "II":{w:36,rows:[PAI,PANC,BI(8),MAT(5),PJOK,SENI].concat(MULOK),note:"Kelas II: 1.224 JP/tahun (36 minggu). Bahasa Inggris belum diajarkan."},
        "III dan IV":{w:36,rows:UPPER.concat(MULOK),note:"Kelas III dan IV: 1.440 JP/tahun (36 minggu). Bahasa Inggris wajib mulai kelas III."},

        "VI":{w:32,rows:UPPER.concat([KKA],MULOK),note:"Kelas VI: 1.344 JP/tahun (asumsi 32 minggu). Koding dan KA 2 JP/minggu (64 JP/tahun) sebagai mapel pilihan."}

        function foot(label,f){return "<tr><td>"+label+"</td>"+keys.map(function(k){return "<td>"+f(k)+"</td>"}).join("")+"</tr>"}
        box.innerHTML='<button id="sk-x" type="button" aria-label="Tutup">&times;</button><h2>Struktur Kurikulum SD/MI</h2>'
          +'<p>Permendikdasmen No. 13 Tahun 2025 (perubahan atas Permendikbudristek No. 12 Tahun 2024), Lampiran II. 1 JP = 35 menit. Angka = JP intrakurikuler per minggu.</p>'
          +'<div id="sk-tabs">'+tabsHtml()+'</div><div class="sk-w"><table><thead><tr><th>Mata Pelajaran</th>'+head+'</tr></thead><tbody>'+body+'</tbody><tfoot>'
          +foot("Total intrakurikuler/mgg",function(k){return ti[k]})
          +foot("Total kokurikuler/mgg",function(k){return tk[k]})
          +foot("Minggu efektif",function(k){return G[k].w})
          +foot("Total JP/tahun",function(k){return tot[k].toLocaleString("id-ID")})
          +'</tfoot></table></div>'
          +'<div class="sk-n"><b>(+1)</b> = kokurikuler 1 JP per minggu di luar jam intrakurikuler (36 JP/tahun; kelas VI 32 JP/tahun). Bahasa Inggris, Koding dan KA, serta Muatan Lokal tidak memiliki kokurikuler. Kelas III dan IV memiliki struktur yang sama. Pendidikan Agama diikuti sesuai agama masing-masing; sekolah menyediakan minimal satu jenis seni. Muatan Lokal maksimal 2 JP/minggu; pembagian 1 JP Bahasa Madura + 1 JP BTQ adalah kebijakan sekolah. Koding dan KA bersifat pilihan, disediakan sesuai sumber daya sekolah.</div>';
      }
      function render(){
        if(cur==="all")return renderAll();
        var g=G[cur],ti=0,tk=0,body="";
        g.rows.forEach(function(r){ti+=r[1];tk+=r[2];
          body+="<tr><td>"+esc(r[0])+"</td><td>"+r[1]+"</td><td>"+(r[2]||"-")+"</td><td>"+(r[1]+r[2])+"</td><td>"+r[1]*g.w+"</td><td>"+r[2]*g.w+"</td><td>"+(r[1]+r[2])*g.w+"</td></tr>"});
        var tabs=tabsHtml();
        box.innerHTML='<button id="sk-x" type="button" aria-label="Tutup">&times;</button><h2>Struktur Kurikulum SD/MI</h2>'
          +'<p>Permendikdasmen No. 13 Tahun 2025 (perubahan atas Permendikbudristek No. 12 Tahun 2024). 1 JP = 35 menit.</p>'
          +'<div id="sk-tabs">'+tabs+'</div><div class="sk-w"><table><thead><tr><th>Mata Pelajaran</th><th>Intra/mgg</th><th>Kokurikuler/mgg</th><th>Total/mgg</th><th>Intra/thn</th><th>Kokurikuler/thn</th><th>Total/thn</th></tr></thead><tbody>'+body
          +'</tbody><tfoot><tr><td>Total</td><td>'+ti+'</td><td>'+tk+'</td><td>'+(ti+tk)+'</td><td>'+ti*g.w+'</td><td>'+tk*g.w+'</td><td>'+(ti+tk)*g.w+'</td></tr></tfoot></table></div>'
          +'<div class="sk-n">'+esc(g.note)+' Muatan Lokal maksimal 2 JP/minggu; pembagian 1 JP Bahasa Madura + 1 JP BTQ adalah kebijakan sekolah. Koding dan KA bersifat pilihan, disediakan sesuai sumber daya sekolah. Rujuk Lampiran II Permendikdasmen No. 13 Tahun 2025 untuk kepastian.</div>';
      }
      function open(){render();ov.classList.add("on")}
      function close(){ov.classList.remove("on")}
      document.getElementById("sk-fab").addEventListener("click",open);
      ov.addEventListener("click",function(e){
        if(e.target===ov||e.target.id==="sk-x")return close();
        var k=e.target.getAttribute&&e.target.getAttribute("data-k");if(k){cur=k;render()}
      });
      document.addEventListener("keydown",function(e){if(e.key==="Escape")close()});
    })();
    </script>

  </body>
</html>
